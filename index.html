<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrishteSync | AI P2P App Builder</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/B5z2c7j7/1781241361720.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0c15 0%, #0f1420 100%);
      color: #e2e8f0;
      overflow: hidden;
      height: 100vh;
      transition: background 0.3s, color 0.2s;
    }
    body.light {
      background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
      color: #1a202c;
    }
    .header {
      background: rgba(15, 20, 32, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(16, 185, 129, 0.3);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }
    body.light .header { background: rgba(255,255,255,0.95); border-bottom-color: #cbd5e0; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo h1 {
      font-size: 1.3rem;
      font-weight: 600;
      background: linear-gradient(135deg, #10b981, #60a5fa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .github-user {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(42, 42, 58, 0.8);
      padding: 6px 12px;
      border-radius: 30px;
    }
    body.light .github-user { background: #e2e8f0; }
    .github-user img { width: 28px; height: 28px; border-radius: 50%; }
    .main-layout {
      display: flex;
      margin-top: 60px;
      height: calc(100vh - 60px);
    }
    .builder-panel {
      width: 30%;
      background: rgba(15, 20, 32, 0.6);
      border-right: 1px solid rgba(16, 185, 129, 0.2);
      padding: 20px;
      overflow-y: auto;
    }
    body.light .builder-panel { background: rgba(255,255,255,0.6); border-right-color: #cbd5e0; }
    .editor-panel {
      width: 50%;
      display: flex;
      flex-direction: column;
      background: #0a0c15;
    }
    body.light .editor-panel { background: #ffffff; }
    .editor-toolbar {
      background: #11131f;
      border-bottom: 1px solid #1f2438;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    body.light .editor-toolbar { background: #f1f5f9; border-bottom-color: #cbd5e0; }
    .file-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      flex: 1;
    }
    .file-tab {
      background: #181c2c;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    body.light .file-tab { background: #e2e8f0; color: #1a202c; }
    .file-tab.active { background: #10b981; color: white; }
    .file-tab button { background: none; border: none; color: inherit; cursor: pointer; margin-left: 4px; }
    #editor-container, #preview-container {
      flex: 1;
      min-height: 0;
    }
    .preview-controls {
      background: #1f2438;
      border-bottom: 1px solid #10b981;
      padding: 8px 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    body.light .preview-controls { background: #e2e8f0; }
    .preview-controls label { font-size: 0.7rem; color: #a0aec0; }
    .preview-controls .input-group { display: flex; gap: 8px; }
    .preview-controls input { flex: 1; padding: 6px 10px; font-size: 0.7rem; background: #0f1420; border: 1px solid #2d3748; border-radius: 4px; color: white; }
    body.light .preview-controls input { background: white; color: black; border-color: #cbd5e0; }
    .preview-status { font-size: 0.7rem; color: #10b981; }
    #preview-iframe-container { width: 100%; height: calc(100% - 80px); background: white; }
    .output-panel {
      width: 20%;
      background: rgba(15, 20, 32, 0.6);
      border-left: 1px solid rgba(16, 185, 129, 0.2);
      display: flex;
      flex-direction: column;
    }
    body.light .output-panel { background: rgba(255,255,255,0.6); border-left-color: #cbd5e0; }
    .panel-header {
      padding: 10px 12px;
      background: #11131f;
      font-weight: 600;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #1f2438;
    }
    body.light .panel-header { background: #f1f5f9; border-bottom-color: #cbd5e0; }
    .console {
      flex: 1;
      padding: 8px;
      font-family: 'Monaco', monospace;
      font-size: 0.7rem;
      overflow-y: auto;
      background: #0a0c15;
    }
    body.light .console { background: #ffffff; color: #1a202c; }
    .console-line {
      padding: 4px 0;
      border-left: 2px solid transparent;
      margin-bottom: 2px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .console-line.success { border-left-color: #10b981; color: #a7f3d0; }
    body.light .console-line.success { color: #065f46; }
    .console-line.error { border-left-color: #ef4444; color: #fecaca; }
    body.light .console-line.error { color: #b91c1c; }
    .console-line.info { border-left-color: #3b82f6; color: #93c5fd; }
    body.light .console-line.info { color: #1e40af; }
    .console-line.warning { border-left-color: #f59e0b; color: #fde68a; }
    body.light .console-line.warning { color: #92400e; }
    .deployment-list { flex: 1; overflow-y: auto; padding: 8px; }
    .deployment-item {
      background: #11131f;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 0.7rem;
    }
    body.light .deployment-item { background: #f1f5f9; }
    .deployment-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .deployment-links a { color: #10b981; text-decoration: none; }
    .deployment-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn-sm { padding: 4px 8px; font-size: 0.65rem; border-radius: 4px; cursor: pointer; border: none; }
    .form-group { margin-bottom: 16px; }
    label { font-size: 0.75rem; color: #8b92b0; display: block; margin-bottom: 6px; }
    body.light label { color: #4a5568; }
    input, select, textarea {
      width: 100%;
      padding: 8px 12px;
      background: #181c2c;
      border: 1px solid #1f2438;
      border-radius: 8px;
      color: #e2e8f0;
      font-family: inherit;
    }
    body.light input, body.light select, body.light textarea { background: white; color: #1a202c; border-color: #cbd5e0; }
    button {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .btn-primary { background: #10b981; color: white; }
    .btn-primary:hover { background: #059669; }
    .btn-secondary { background: #181c2c; color: #e2e8f0; border: 1px solid #1f2438; }
    body.light .btn-secondary { background: #e2e8f0; color: #1a202c; border-color: #cbd5e0; }
    .btn-secondary:hover { background: #1f2438; }
    .btn-outline { background: transparent; border: 1px solid #10b981; color: #10b981; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #b91c1c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="header">
  <div class="logo"><h1>GrishteSync</h1><span style="font-size:0.7rem;">v5.5</span></div>
  <div style="display: flex; gap: 12px;">
    <button id="themeToggleBtn" class="btn-outline"><i class="fas fa-moon"></i></button>
    <button id="shareBtn" class="btn-outline"><i class="fas fa-share-alt"></i> Share</button>
    <button id="exportGistBtn" class="btn-outline"><i class="fab fa-github"></i> Gist</button>
    <div id="authSection">
      <button id="loginBtn" class="btn-outline"><i class="fab fa-github"></i> Connect GitHub</button>
      <div id="userInfo" style="display:none;" class="github-user">
        <img id="userAvatar" src=""><span id="userName"></span>
        <button id="logoutBtn" class="btn-outline" style="padding:4px 8px;">Logout</button>
      </div>
    </div>
  </div>
</div>

<div class="main-layout">
  <div class="builder-panel">
    <div class="form-group"><label>📱 App Name</label><input id="appName" placeholder="my-awesome-app"></div>
    <div class="form-group">
      <label>🎯 Project Type</label>
      <select id="projectType">
        <option value="python">🐍 Python App (HF Spaces)</option>
        <option value="web">🌐 Static Website (GitHub Pages)</option>
      </select>
    </div>
    <div class="form-group">
      <label>📦 Existing Repo / Space (optional)</label>
      <select id="repoSelect"><option value="">-- Create new --</option></select>
    </div>
    <div class="form-group">
      <label>🤖 AI Mode</label>
      <select id="aiMode">
        <option value="generate">✨ Generate New</option>
        <option value="fix">🔧 Fix Bugs</option>
        <option value="improve">🎨 Improve UI</option>
        <option value="feature">➕ Add Feature</option>
      </select>
    </div>
    <div class="form-group"><label>💬 Describe your app</label><textarea id="prompt" rows="4" placeholder="Example: A personal diary app with Flask, SQLite, and CRUD operations"></textarea></div>
    <button id="generateBtn" class="btn-primary" style="width:100%;"><i class="fas fa-magic"></i> Generate App</button>
    <div id="deployActions" style="display:none; margin-top:16px;">
      <div style="display:flex; gap:8px;">
        <button id="deployGithubBtn" class="btn-secondary" style="flex:1;"><i class="fab fa-github"></i> Deploy GitHub</button>
        <button id="deployHfBtn" class="btn-secondary" style="flex:1;"><i class="fab fa-huggingface"></i> Deploy HF</button>
      </div>
    </div>
  </div>

  <div class="editor-panel">
    <div class="editor-toolbar">
      <div class="file-tabs" id="fileTabs"></div>
      <div style="display: flex; gap: 8px;">
        <button id="previewToggleBtn" class="btn-outline" style="padding:4px 8px;"><i class="fas fa-eye"></i> Preview</button>
        <button id="saveFileBtn" class="btn-outline" style="padding:4px 8px;"><i class="fas fa-save"></i> Save</button>
        <button id="downloadZipBtn" class="btn-outline" style="padding:4px 8px;"><i class="fas fa-download"></i> ZIP</button>
      </div>
    </div>
    <div id="editor-container"></div>
    <div id="preview-container" style="display: none; flex-direction: column; background: white;">
      <div id="preview-controls" class="preview-controls">
        <label>🔍 Hugging Face Space URL (for Python apps)</label>
        <div class="input-group">
          <input type="text" id="customSpaceUrl" placeholder="https://huggingface.co/spaces/username/space-name">
          <button id="previewSpaceBtn" class="btn-sm btn-primary">Load</button>
        </div>
        <div id="preview-status" class="preview-status"></div>
      </div>
      <div id="preview-iframe-container"></div>
    </div>
  </div>

  <div class="output-panel">
    <div class="panel-header">
      <span><i class="fas fa-terminal"></i> Console</span>
      <div><button id="clearConsoleBtn" class="btn-outline" style="padding:2px 8px;">Clear</button></div>
    </div>
    <div id="console" class="console"><div class="console-line info">✨ Ready. Connect GitHub to start.</div></div>
    <div style="padding:8px; display:flex; gap:8px;">
      <button id="diagnoseBtn" class="btn-primary" style="flex:1;"><i class="fas fa-stethoscope"></i> Diagnose & Fix</button>
    </div>
    <div class="panel-header"><span><i class="fas fa-rocket"></i> Deployments</span></div>
    <div id="deploymentsList" class="deployment-list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  // ======================== COMPLETE JAVASCRIPT ========================
  const API_BASE = "https://grishtesync-backend.onrender.com";
  let githubToken = localStorage.getItem("github_token");
  let githubUser = localStorage.getItem("github_user");
  let generatedFiles = {};
  let currentFile = null;
  let editor = null;
  let deployments = JSON.parse(localStorage.getItem("deployments") || "[]");
  let currentPlatform = 'python';
  let previewMode = false;

  const $ = id => document.getElementById(id);
  const consoleDiv = $('console');
  function appendToConsole(msg, type = 'info') {
    const line = document.createElement('div');
    line.className = `console-line ${type}`;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    consoleDiv.appendChild(line);
    line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function clearConsole() { consoleDiv.innerHTML = ''; appendToConsole('Console cleared.', 'info'); }

  // Theme
  function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') document.body.classList.add('light');
    $('themeToggleBtn').onclick = () => {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    };
  }

  // Share latest deployment URL
  async function shareLatestUrl() {
    const latestDeploy = deployments[0];
    if (!latestDeploy) { appendToConsole('No deployments found to share.', 'warning'); return; }
    const url = latestDeploy.hfUrl || latestDeploy.githubUrl || latestDeploy.pagesUrl;
    if (url) {
      await navigator.clipboard.writeText(url);
      appendToConsole(`✅ Copied URL to clipboard: ${url}`, 'success');
    } else { appendToConsole('No live URL available for the latest deployment.', 'error'); }
  }

  // Export to Gist
  async function exportToGist() {
    if (!githubToken) { appendToConsole('Connect GitHub first to create a Gist.', 'error'); return; }
    if (Object.keys(generatedFiles).length === 0) { appendToConsole('No files to export.', 'error'); return; }
    const gistFiles = {};
    for (const [name, content] of Object.entries(generatedFiles)) {
      gistFiles[name] = { content };
    }
    try {
      const res = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' },
        body: JSON.stringify({
          description: `App generated by GrishteSync: ${$('appName').value.trim()}`,
          public: false,
          files: gistFiles
        })
      });
      const data = await res.json();
      if (data.html_url) {
        await navigator.clipboard.writeText(data.html_url);
        appendToConsole(`✅ Gist created and URL copied: ${data.html_url}`, 'success');
      } else throw new Error(data.message || 'Failed to create gist');
    } catch(e) { appendToConsole(`❌ Gist failed: ${e.message}`, 'error'); }
  }

  // Monaco Editor
  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
  require(['vs/editor/editor.main'], function() {
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      value: '// Generate or select a file',
      language: 'python',
      theme: 'vs-dark',
      automaticLayout: true,
      minimap: { enabled: false },
      fontSize: 13
    });
  });
  function getLanguage(filename) {
    const ext = filename.split('.').pop();
    const map = { py: 'python', js: 'javascript', html: 'html', css: 'css', json: 'json', md: 'markdown', txt: 'text' };
    return map[ext] || 'text';
  }
  function openFile(filename) {
    currentFile = filename;
    if (editor && generatedFiles[filename]) {
      editor.setValue(generatedFiles[filename]);
      monaco.editor.setModelLanguage(editor.getModel(), getLanguage(filename));
      renderFileTabs();
      if (previewMode && filename === 'index.html') refreshPreview();
    }
  }
  function renderFileTabs() {
    const tabsDiv = $('fileTabs');
    tabsDiv.innerHTML = '';
    for (const [name] of Object.entries(generatedFiles)) {
      const tab = document.createElement('div');
      tab.className = `file-tab ${currentFile === name ? 'active' : ''}`;
      tab.innerHTML = `<span>${name}</span><button onclick="event.stopPropagation(); deleteFile('${name}')">&times;</button>`;
      tab.onclick = () => openFile(name);
      tabsDiv.appendChild(tab);
    }
  }
  function saveCurrentFile() {
    if (currentFile && editor) {
      generatedFiles[currentFile] = editor.getValue();
      appendToConsole(`✅ Saved ${currentFile}`, 'success');
      if (previewMode && currentFile === 'index.html') refreshPreview();
    }
  }
  function deleteFile(name) {
    delete generatedFiles[name];
    if (currentFile === name) { currentFile = null; if(editor) editor.setValue('// File deleted'); }
    renderFileTabs();
    appendToConsole(`🗑️ Deleted ${name}`, 'warning');
    if (previewMode && name === 'index.html') refreshPreview();
  }
  function downloadZip() {
    if (Object.keys(generatedFiles).length === 0) return appendToConsole("❌ No files to download", 'error');
    const zip = new JSZip();
    for (const [name, content] of Object.entries(generatedFiles)) zip.file(name, content);
    zip.generateAsync({ type: 'blob' }).then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${$('appName').value.trim() || 'app'}.zip`;
      a.click();
      URL.revokeObjectURL(a.href);
      appendToConsole("📦 Downloaded ZIP", 'success');
    });
  }

  // Preview functions
  function buildPreviewHTML() {
    if (!generatedFiles['index.html']) return '<div style="padding:20px;">No index.html to preview</div>';
    let html = generatedFiles['index.html'];
    if (generatedFiles['style.css'] && !html.includes('style.css')) {
      html = html.replace('</head>', '<link rel="stylesheet" href="data:text/css;base64,' + btoa(generatedFiles['style.css']) + '">\n</head>');
    }
    if (generatedFiles['script.js'] && !html.includes('script.js')) {
      html = html.replace('</body>', '<script src="data:text/javascript;base64,' + btoa(generatedFiles['script.js']) + '"><\/script>\n</body>');
    }
    return html;
  }
  function loadSpacePreview(url) {
    const container = $('preview-iframe-container');
    const statusDiv = $('preview-status');
    if (!url.includes('huggingface.co/spaces/')) {
      statusDiv.innerHTML = '❌ Invalid Space URL. Must be like https://huggingface.co/spaces/username/space-name';
      container.innerHTML = '';
      return;
    }
    statusDiv.innerHTML = '🔄 Loading Space...';
    container.innerHTML = `<iframe src="${url}" style="width:100%; height:100%; border:none;" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-downloads"></iframe>`;
    statusDiv.innerHTML = '✅ Preview loaded.';
    localStorage.setItem('previewSpaceUrl', url);
  }
  function refreshPreview() {
    const controls = $('preview-controls');
    const iframeContainer = $('preview-iframe-container');
    const statusDiv = $('preview-status');
    iframeContainer.innerHTML = '';
    if (currentPlatform === 'web' && generatedFiles['index.html']) {
      controls.style.display = 'none';
      const iframe = document.createElement('iframe');
      iframe.srcdoc = buildPreviewHTML();
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframeContainer.appendChild(iframe);
    } else {
      controls.style.display = 'flex';
      const lastHfDeploy = deployments.find(d => d.hfUrl);
      let spaceUrl = localStorage.getItem('previewSpaceUrl') || (lastHfDeploy ? lastHfDeploy.hfUrl : '');
      if (spaceUrl) {
        $('customSpaceUrl').value = spaceUrl;
        loadSpacePreview(spaceUrl);
      } else {
        statusDiv.innerHTML = 'No HF Space URL. Paste one above to preview.';
        iframeContainer.innerHTML = '<div style="padding:20px; text-align:center;">Preview not available.</div>';
      }
    }
  }
  function togglePreview() {
    previewMode = !previewMode;
    const editorDiv = $('editor-container');
    const previewDiv = $('preview-container');
    const toggleBtn = $('previewToggleBtn');
    if (previewMode) {
      editorDiv.style.display = 'none';
      previewDiv.style.display = 'flex';
      toggleBtn.innerHTML = '<i class="fas fa-code"></i> Code';
      refreshPreview();
    } else {
      editorDiv.style.display = 'flex';
      previewDiv.style.display = 'none';
      toggleBtn.innerHTML = '<i class="fas fa-eye"></i> Preview';
    }
  }

  // Load repos from backend
  async function loadRepos(platform) {
    const repoSelect = $('repoSelect');
    repoSelect.innerHTML = '<option value="">-- Loading... --</option>';
    const token = platform === 'github' ? githubToken : null;
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    try {
      const res = await fetch(`${API_BASE}/api/list-repos?platform=${platform}`, { headers });
      const data = await res.json();
      repoSelect.innerHTML = '<option value="">-- Create new --</option>';
      if (data.repos && data.repos.length) {
        data.repos.forEach(repo => {
          const opt = document.createElement('option');
          opt.value = repo.full_name;
          opt.textContent = `${repo.name} (${platform === 'github' ? 'GitHub' : 'HF Space'})`;
          repoSelect.appendChild(opt);
        });
      } else {
        repoSelect.innerHTML = '<option value="">-- No existing repos found --</option>';
      }
    } catch(e) {
      console.error(e);
      repoSelect.innerHTML = '<option value="">-- Error loading --</option>';
      appendToConsole(`⚠️ Failed to load ${platform} repos: ${e.message}`, 'warning');
    }
  }

  $('projectType').addEventListener('change', (e) => {
    currentPlatform = e.target.value;
    if (githubToken) {
      const platform = currentPlatform === 'python' ? 'huggingface' : 'github';
      loadRepos(platform);
    }
  });

  // Generate
  async function generateApp() {
    const appName = $('appName').value.trim();
    const prompt = $('prompt').value.trim();
    const mode = $('aiMode').value;
    const projectType = $('projectType').value;
    const selectedRepo = $('repoSelect').value;
    if (!appName || !prompt) return appendToConsole("❌ App name and prompt required", 'error');
    $('generateBtn').disabled = true;
    $('generateBtn').innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Generating...';
    appendToConsole(`🤖 Generating ${mode} for "${appName}"...`, 'info');
    try {
      const res = await fetch(`${API_BASE}/api/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, prompt_type: mode, platform: projectType === 'python' ? 'huggingface' : 'github', repo: selectedRepo || null, app_name: appName })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      generatedFiles = data.files;
      currentFile = Object.keys(generatedFiles)[0];
      renderFileTabs();
      if (currentFile) openFile(currentFile);
      appendToConsole(`✅ Generated ${Object.keys(generatedFiles).length} files`, 'success');
      $('deployActions').style.display = 'block';
    } catch(e) { appendToConsole(`❌ ${e.message}`, 'error'); }
    finally { $('generateBtn').disabled = false; $('generateBtn').innerHTML = '<i class="fas fa-magic"></i> Generate App'; }
  }

  // Diagnose
  async function diagnoseFix() {
    const errorLog = consoleDiv.innerText;
    if (!errorLog || errorLog === 'Ready.' || errorLog.includes('Console cleared')) {
      appendToConsole("❌ No error logs to diagnose. Deploy an app first to see logs.", 'error');
      return;
    }
    if (Object.keys(generatedFiles).length === 0) {
      appendToConsole("❌ No generated code to fix. Generate an app first.", 'error');
      return;
    }
    const diagBtn = $('diagnoseBtn');
    diagBtn.disabled = true;
    diagBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Diagnosing...';
    appendToConsole("🩺 Sending error logs to AI for diagnosis...", 'info');
    try {
      const res = await fetch(`${API_BASE}/api/diagnose`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ error_log: errorLog, files: generatedFiles })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      generatedFiles = data.files;
      renderFileTabs();
      if (Object.keys(generatedFiles).length) openFile(Object.keys(generatedFiles)[0]);
      appendToConsole("✅ Diagnosis complete. Fixed code ready. Redeploy.", 'success');
    } catch(e) { appendToConsole(`❌ Diagnosis failed: ${e.message}`, 'error'); }
    finally { diagBtn.disabled = false; diagBtn.innerHTML = '<i class="fas fa-stethoscope"></i> Diagnose & Fix'; }
  }

  // Deploy to GitHub
  async function deployToGitHub() {
    if (!githubToken) return appendToConsole("❌ Connect GitHub first", 'error');
    if (Object.keys(generatedFiles).length === 0) return appendToConsole("❌ No files to deploy", 'error');
    const appName = $('appName').value.trim();
    const repoName = `GrishteSync-${appName}`;
    const btn = $('deployGithubBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Deploying...';
    appendToConsole(`📤 Deploying to GitHub: ${repoName}...`, 'info');
    try {
      const res = await fetch(`${API_BASE}/api/deploy`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${githubToken}` },
        body: JSON.stringify({ repo_name: repoName, files: generatedFiles, version: '1.0.0', app_name: appName, prompt: $('prompt').value.trim() })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      appendToConsole(`✅ GitHub repo: ${data.repo_url}`, 'success');
      if (data.pr_url) appendToConsole(`🔀 Pull Request: ${data.pr_url}`, 'info');
      if (data.pages_url) appendToConsole(`🌐 Pages: ${data.pages_url}`, 'success');
      const deployment = { appName, timestamp: Date.now(), githubUrl: data.repo_url, prUrl: data.pr_url, pagesUrl: data.pages_url };
      deployments.unshift(deployment);
      localStorage.setItem('deployments', JSON.stringify(deployments.slice(0,10)));
      renderDeployments();
    } catch(e) { appendToConsole(`❌ ${e.message}`, 'error'); }
    finally { btn.disabled = false; btn.innerHTML = '<i class="fab fa-github"></i> Deploy GitHub'; }
  }

  // Deploy to HF
  async function deployToHF() {
    if (Object.keys(generatedFiles).length === 0) return appendToConsole("❌ No files to deploy", 'error');
    const appName = $('appName').value.trim();
    const spaceName = `GrishteSync-${appName}`.toLowerCase().replace(/[^a-z0-9-]/g, '-');
    const btn = $('deployHfBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Deploying...';
    appendToConsole(`🤗 Deploying to Hugging Face: ${spaceName}...`, 'info');
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (githubToken) headers['Authorization'] = `Bearer ${githubToken}`;
      const res = await fetch(`${API_BASE}/api/deploy-hf`, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ repo_full_name: spaceName, files: generatedFiles, platform: 'huggingface', app_name: appName, prompt: $('prompt').value.trim() })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      appendToConsole(`✅ HF Space: ${data.space_url}`, 'success');
      if (data.embed_url) appendToConsole(`🌐 Embedded: ${data.embed_url}`, 'success');
      const deployment = { appName, timestamp: Date.now(), hfUrl: data.space_url, embedUrl: data.embed_url };
      deployments.unshift(deployment);
      localStorage.setItem('deployments', JSON.stringify(deployments.slice(0,10)));
      renderDeployments();
      localStorage.setItem('previewSpaceUrl', data.space_url);
      if (previewMode && currentPlatform === 'python') refreshPreview();
    } catch(e) { appendToConsole(`❌ ${e.message}`, 'error'); }
    finally { btn.disabled = false; btn.innerHTML = '<i class="fab fa-huggingface"></i> Deploy HF'; }
  }

  // PR actions
  async function approveAndMergePR(prUrl) {
    if (!githubToken) return appendToConsole("❌ Not logged in", 'error');
    appendToConsole(`🔄 Approving and merging PR: ${prUrl}...`, 'info');
    try {
      const match = prUrl.match(/github\.com\/(.+?)\/(.+?)\/pull\/(\d+)/);
      if (!match) throw new Error("Invalid PR URL");
      const [, owner, repo, pull_number] = match;
      const url = `https://api.github.com/repos/${owner}/${repo}/pulls/${pull_number}/merge`;
      const resp = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' },
        body: JSON.stringify({ merge_method: 'merge' })
      });
      if (resp.status === 200) {
        appendToConsole(`✅ PR merged successfully!`, 'success');
        deployments = deployments.map(d => d.prUrl === prUrl ? { ...d, merged: true } : d);
        localStorage.setItem('deployments', JSON.stringify(deployments));
        renderDeployments();
      } else {
        const text = await resp.text();
        appendToConsole(`❌ Merge failed: ${text}`, 'error');
      }
    } catch(e) { appendToConsole(`❌ ${e.message}`, 'error'); }
  }
  async function cancelPR(prUrl) {
    if (!githubToken) return appendToConsole("❌ Not logged in", 'error');
    appendToConsole(`🔄 Closing PR: ${prUrl}...`, 'info');
    try {
      const match = prUrl.match(/github\.com\/(.+?)\/(.+?)\/pull\/(\d+)/);
      if (!match) throw new Error("Invalid PR URL");
      const [, owner, repo, pull_number] = match;
      const url = `https://api.github.com/repos/${owner}/${repo}/pulls/${pull_number}`;
      const resp = await fetch(url, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' },
        body: JSON.stringify({ state: 'closed' })
      });
      if (resp.status === 200) {
        appendToConsole(`✅ PR closed successfully`, 'success');
        deployments = deployments.filter(d => d.prUrl !== prUrl);
        localStorage.setItem('deployments', JSON.stringify(deployments));
        renderDeployments();
      } else {
        const text = await resp.text();
        appendToConsole(`❌ Failed to close: ${text}`, 'error');
      }
    } catch(e) { appendToConsole(`❌ ${e.message}`, 'error'); }
  }

  function renderDeployments() {
    const container = $('deploymentsList');
    if (!deployments.length) { container.innerHTML = '<div style="color:#8b92b0;text-align:center;">No deployments yet</div>'; return; }
    container.innerHTML = deployments.map(d => `
      <div class="deployment-item">
        <div><strong>${d.appName}</strong> <span style="font-size:0.6rem;">${new Date(d.timestamp).toLocaleString()}</span></div>
        <div class="deployment-links">
          ${d.githubUrl ? `<a href="${d.githubUrl}" target="_blank"><i class="fab fa-github"></i> Repo</a>` : ''}
          ${d.prUrl ? `<a href="${d.prUrl}" target="_blank"><i class="fas fa-code-branch"></i> PR</a>` : ''}
          ${d.pagesUrl ? `<a href="${d.pagesUrl}" target="_blank"><i class="fas fa-globe"></i> Pages</a>` : ''}
          ${d.hfUrl ? `<a href="${d.hfUrl}" target="_blank"><i class="fab fa-huggingface"></i> Space</a>` : ''}
          ${d.embedUrl ? `<a href="${d.embedUrl}" target="_blank"><i class="fas fa-external-link-alt"></i> Embed</a>` : ''}
        </div>
        ${d.prUrl && !d.merged ? `
          <div class="deployment-actions">
            <button class="btn-sm btn-primary approve-pr" data-url="${d.prUrl}"><i class="fas fa-check"></i> Approve & Merge</button>
            <button class="btn-sm btn-danger cancel-pr" data-url="${d.prUrl}"><i class="fas fa-times"></i> Cancel</button>
          </div>
        ` : ''}
      </div>
    `).join('');
    document.querySelectorAll('.approve-pr').forEach(btn => btn.onclick = () => approveAndMergePR(btn.dataset.url));
    document.querySelectorAll('.cancel-pr').forEach(btn => btn.onclick = () => cancelPR(btn.dataset.url));
  }

  function updateAuthUI() {
    if (githubToken) {
      $('loginBtn').style.display = 'none';
      $('userInfo').style.display = 'flex';
      fetch(`https://api.github.com/user`, { headers: { Authorization: `Bearer ${githubToken}` } })
        .then(r => r.json()).then(data => { $('userName').innerText = data.login; $('userAvatar').src = data.avatar_url; })
        .catch(() => {});
      const platform = $('projectType').value === 'python' ? 'huggingface' : 'github';
      loadRepos(platform);
    } else {
      $('loginBtn').style.display = 'inline-block';
      $('userInfo').style.display = 'none';
    }
  }

  // Event listeners
  $('previewToggleBtn').onclick = togglePreview;
  $('saveFileBtn').onclick = saveCurrentFile;
  $('downloadZipBtn').onclick = downloadZip;
  $('clearConsoleBtn').onclick = clearConsole;
  $('generateBtn').onclick = generateApp;
  $('diagnoseBtn').onclick = diagnoseFix;
  $('deployGithubBtn').onclick = deployToGitHub;
  $('deployHfBtn').onclick = deployToHF;
  $('shareBtn').onclick = shareLatestUrl;
  $('exportGistBtn').onclick = exportToGist;
  $('previewSpaceBtn').onclick = () => { const url = $('customSpaceUrl').value.trim(); if (url) loadSpacePreview(url); };
  $('loginBtn').onclick = () => window.location.href = `${API_BASE}/auth/login`;
  $('logoutBtn').onclick = () => { localStorage.clear(); location.reload(); };

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  if (token) {
    localStorage.setItem('github_token', token);
    localStorage.setItem('github_user', urlParams.get('github_user') || '');
    window.history.replaceState({}, '', window.location.pathname);
    location.reload();
  }
  initTheme();
  updateAuthUI();
  renderDeployments();
  appendToConsole("✨ GrishteSync ready. Connect GitHub to start.", 'success');
</script>
</body>
</html>
