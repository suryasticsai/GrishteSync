<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GrishteSync IDE – AI App Builder</title>
  <!-- Font Awesome, Google Fonts, Monaco Editor -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #1e1e2f;
      --bg-sidebar: #181825;
      --bg-editor: #1e1e2f;
      --bg-terminal: #0f0f1a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --accent: #10b981;
      --accent-hover: #34d399;
      --border: #2a2a3a;
    }

    body.light {
      --bg-primary: #f5f5f5;
      --bg-sidebar: #e8e8e8;
      --bg-editor: #ffffff;
      --bg-terminal: #fafafa;
      --text-primary: #1e1e2f;
      --text-secondary: #4a4a5a;
      --border: #d0d0d0;
    }

    body {
      font-family: 'Inter', monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      overflow: hidden;
      height: 100vh;
    }

    /* Layout grid */
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* Top bar */
    .top-bar {
      grid-column: 1 / -1;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .logo {
      font-weight: 700;
      font-size: 1.3rem;
      background: linear-gradient(135deg, #10b981, #059669);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .prompt-area {
      flex: 2;
      display: flex;
      gap: 8px;
    }
    .prompt-area input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-editor);
      color: var(--text-primary);
    }
    .btn-primary, .btn-secondary, .btn-danger {
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--border); color: var(--text-primary); }
    .btn-danger { background: #ef4444; color: white; }
    .badge {
      background: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
    }
    .github-badge {
      background: #2d3748;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .file-tree {
      list-style: none;
      margin-top: 8px;
    }
    .file-tree li {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .file-tree li:hover { background: var(--border); }
    .active-file { background: var(--accent); color: white; }

    /* Main area */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .editor-container {
      flex: 2;
      position: relative;
    }
    #editor {
      width: 100%;
      height: 100%;
      font-family: monospace;
      font-size: 14px;
      background: var(--bg-editor);
      color: var(--text-primary);
      border: none;
      padding: 16px;
      resize: none;
    }
    .bottom-panel {
      background: var(--bg-terminal);
      border-top: 1px solid var(--border);
      height: 280px;
      display: flex;
      flex-direction: column;
    }
    .panel-tabs {
      display: flex;
      gap: 2px;
      padding: 4px 8px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 6px 16px;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      font-size: 0.8rem;
    }
    .tab.active {
      background: var(--bg-terminal);
      color: var(--accent);
    }
    .console-output {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .status-bar {
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      padding: 4px 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <div class="top-bar">
    <div class="logo"><i class="fas fa-code"></i> GrishteSync IDE</div>
    <div class="prompt-area">
      <select id="promptTypeSelect" style="padding: 6px; border-radius: 6px; background: var(--bg-editor); color: var(--text-primary);">
        <option value="generate">✨ Generate</option>
        <option value="fix">🔧 Fix</option>
        <option value="improve_ui">🎨 Improve UI</option>
        <option value="add_feature">➕ Add feature</option>
        <option value="refactor">📦 Refactor</option>
        <option value="diagnose">🩺 Diagnose</option>
      </select>
      <input type="text" id="promptInput" placeholder="Describe your app or change...">
      <button id="generateBtn" class="btn-primary"><i class="fas fa-magic"></i> Generate</button>
    </div>
    <div>
      <button id="deployGithubBtn" class="btn-secondary" style="display:none;"><i class="fab fa-github"></i> Deploy to GitHub</button>
      <button id="deployHfBtn" class="btn-secondary"><i class="fab fa-huggingface"></i> Deploy to HF</button>
      <button id="loginBtn" class="btn-secondary" style="display:none;"><i class="fab fa-github"></i> Connect GitHub</button>
      <span id="gitBadge" style="display:none;" class="github-badge"><i class="fab fa-github"></i> <span id="gitUser"></span> <i id="disconnectGit" class="fas fa-times-circle" style="cursor:pointer;"></i></span>
    </div>
  </div>

  <!-- Sidebar + Main -->
  <div class="sidebar">
    <div>
      <div class="flex-between"><strong><i class="fas fa-folder-open"></i> Explorer</strong> <button id="refreshFilesBtn" class="btn-secondary" style="padding:2px 6px;">↻</button></div>
      <ul id="fileTree" class="file-tree"></ul>
    </div>
    <div>
      <div><strong><i class="fas fa-database"></i> Repo Select</strong></div>
      <select id="repoSelect" style="width:100%; margin-top:4px; padding:6px; border-radius:6px;"></select>
      <button id="refreshReposBtn" class="btn-secondary" style="margin-top:4px; width:100%;">Refresh Repos</button>
    </div>
    <div>
      <div><strong><i class="fas fa-terminal"></i> AI Mode</strong></div>
      <div id="frameworkBadge" class="badge" style="margin-top:4px;">Not generated</div>
    </div>
  </div>

  <div class="main">
    <!-- Editor -->
    <div class="editor-container">
      <textarea id="editor" placeholder="Generated files will appear here. Click a file from the explorer to edit."></textarea>
    </div>

    <!-- Bottom panel (console) -->
    <div class="bottom-panel">
      <div class="panel-tabs">
        <div class="tab active" data-panel="console">📋 Console</div>
        <div class="tab" data-panel="logs">📄 Build Logs</div>
      </div>
      <div id="consolePanel" class="console-output"></div>
      <div id="logsPanel" class="console-output" style="display:none;"></div>
    </div>
    <div class="status-bar">
      <span id="statusText">Ready</span>
      <span><i class="fas fa-cloud-upload-alt"></i> <span id="deployStatus">Not deployed</span></span>
    </div>
  </div>
</div>

<!-- Monaco Editor (optional, but we'll use a simple textarea for simplicity) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  // ---------- Configuration ----------
  const API_BASE = "https://grishtesync-backend.onrender.com";
  const API_GENERATE = `${API_BASE}/api/generate`;
  const API_DEPLOY = `${API_BASE}/api/deploy`;
  const API_DEPLOY_HF = `${API_BASE}/api/deploy-hf`;
  const API_REPO_FILES = `${API_BASE}/api/repo-files`;
  const API_HF_LOGS = `${API_BASE}/api/hf-logs`;
  const API_DIAGNOSE = `${API_BASE}/api/diagnose`;
  const AUTH_GITHUB = `${API_BASE}/auth/login`;

  // Global state
  let currentVersion = "0.0.0";
  let repoName = "";
  let generatedFiles = {};      // filename -> content
  let currentFile = null;
  let githubToken = localStorage.getItem("github_token") || null;
  let githubUsername = localStorage.getItem("github_user") || null;
  let liveSpaceUrl = null;
  let currentSpaceFullName = null;
  let consoleInterval = null;
  let lastLogCount = 0;
  let lastDeployType = null;
  let lastDeployParams = null;
  let currentPRUrl = null;

  // DOM elements
  const $ = id => document.getElementById(id);
  const editor = $('editor');
  const fileTree = $('fileTree');
  const consoleOutput = $('consolePanel');
  const logsPanel = $('logsPanel');
  const statusSpan = $('statusText');
  const deployStatusSpan = $('deployStatus');

  // Helper functions
  function appendToConsole(msg, isLog = false) {
    const target = isLog ? logsPanel : consoleOutput;
    if (target) {
      target.innerText += msg + '\n';
      target.scrollTop = target.scrollHeight;
    }
  }
  function showToast(msg) { alert(msg); }
  function showError(msg) { appendToConsole(`❌ ${msg}`); }
  function updateStatus(msg) { if(statusSpan) statusSpan.innerText = msg; }

  // Auth UI
  function updateAuthUI() {
    const loginBtn = $('loginBtn');
    const gitBadge = $('gitBadge');
    const gitUserSpan = $('gitUser');
    const deployGithubBtn = $('deployGithubBtn');
    if (githubToken) {
      if(loginBtn) loginBtn.style.display = 'none';
      if(gitBadge) gitBadge.style.display = 'inline-flex';
      if(gitUserSpan) gitUserSpan.innerText = githubUsername || 'user';
      if(deployGithubBtn) deployGithubBtn.style.display = 'inline-block';
      fetchUserRepos();
    } else {
      if(loginBtn) loginBtn.style.display = 'inline-block';
      if(gitBadge) gitBadge.style.display = 'none';
      if(deployGithubBtn) deployGithubBtn.style.display = 'none';
    }
  }

  async function fetchUserRepos() {
    if (!githubToken) return;
    const repoSelect = $('repoSelect');
    try {
      repoSelect.innerHTML = '<option>Loading...</option>';
      const repos = await safeFetch('https://api.github.com/user/repos?per_page=100', {
        headers: { Authorization: `token ${githubToken}` }
      });
      const grishteRepos = repos.filter(r => r.name.toLowerCase().startsWith('grishtesync-'));
      repoSelect.innerHTML = '<option value="">-- Select a repo --</option>';
      grishteRepos.forEach(repo => {
        const opt = document.createElement('option');
        opt.value = repo.full_name;
        opt.textContent = repo.full_name;
        repoSelect.appendChild(opt);
      });
    } catch(e) { repoSelect.innerHTML = '<option>Error loading repos</option>'; }
  }

  async function safeFetch(url, options = {}) {
    const res = await fetch(url, options);
    const text = await res.text();
    try { return JSON.parse(text); } catch(e) { throw new Error(`Server error (${res.status}): ${text.slice(0,200)}`); }
  }

  // Load repo files into file tree (GitHub)
  async function loadRepoFiles(repoFull) {
    if (!githubToken || !repoFull) return;
    try {
      const data = await safeFetch(API_REPO_FILES, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repo: repoFull, token: githubToken })
      });
      if (data.error) throw new Error(data.error);
      // Merge with generated files? For now, just show repo files.
      const fileList = data.files;
      fileTree.innerHTML = '';
      fileList.forEach(file => {
        const li = document.createElement('li');
        li.innerHTML = `<i class="far fa-file-code"></i> ${file.path}`;
        li.onclick = () => loadAndEditRemoteFile(file);
        fileTree.appendChild(li);
      });
    } catch(e) { showError(e.message); }
  }

  async function loadAndEditRemoteFile(file) {
    const resp = await fetch(file.download_url);
    const content = await resp.text();
    editor.value = content;
    currentFile = file.path;
    updateStatus(`Editing ${file.path}`);
  }

  // Render generated files in file tree
  function renderFileTree() {
    fileTree.innerHTML = '';
    for (const [filename, content] of Object.entries(generatedFiles)) {
      const li = document.createElement('li');
      li.innerHTML = `<i class="fas fa-file-alt"></i> ${filename}`;
      li.onclick = () => {
        editor.value = content;
        currentFile = filename;
        updateStatus(`Editing ${filename}`);
        // highlight active
        document.querySelectorAll('.file-tree li').forEach(l => l.classList.remove('active-file'));
        li.classList.add('active-file');
      };
      fileTree.appendChild(li);
    }
  }

  // Generate new code
  async function generate() {
    const prompt = $('promptInput').value.trim();
    if (!prompt) return showToast("Enter a prompt");
    const selectedRepo = $('repoSelect').value;
    const promptType = $('promptTypeSelect').value;
    repoName = selectedRepo || `GrishteSync-${Date.now().toString(36)}`;
    updateStatus("Generating...");
    try {
      const data = await safeFetch(API_GENERATE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': githubToken ? `token ${githubToken}` : '' },
        body: JSON.stringify({ prompt, repo: selectedRepo, prompt_type: promptType })
      });
      if (data.error) throw new Error(data.error);
      generatedFiles = data.files;
      renderFileTree();
      // Open first file
      const firstFile = Object.keys(generatedFiles)[0];
      if (firstFile) {
        editor.value = generatedFiles[firstFile];
        currentFile = firstFile;
      }
      updateStatus(`Generated in ${data.generate_time}s`);
      appendToConsole(`✅ Generation complete. ${Object.keys(generatedFiles).length} files.`);
    } catch(e) { showError(e.message); updateStatus("Generation failed"); }
  }

  // Deploy to GitHub
  async function deployToGitHub() {
    if (!githubToken) return showToast("Connect GitHub first.");
    if (Object.keys(generatedFiles).length === 0) return showToast("No files to deploy");
    updateStatus("Deploying to GitHub...");
    try {
      const data = await safeFetch(API_DEPLOY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `token ${githubToken}` },
        body: JSON.stringify({ repo_name: repoName, files: generatedFiles, version: currentVersion, pr_description: "IDE deployment" })
      });
      if (data.error) throw new Error(data.error);
      currentPRUrl = data.pr_url;
      deployStatusSpan.innerText = `GitHub: PR created`;
      appendToConsole(`✅ Deployed to GitHub. PR: ${data.pr_url}`);
      updateStatus("Deployed to GitHub");
    } catch(e) { showError(e.message); updateStatus("Deploy failed"); }
  }

  // Deploy to HF
  async function deployToHF() {
    if (Object.keys(generatedFiles).length === 0) return showToast("No files to deploy");
    updateStatus("Deploying to Hugging Face...");
    try {
      const data = await safeFetch(API_DEPLOY_HF, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': githubToken ? `token ${githubToken}` : '' },
        body: JSON.stringify({ repo_full_name: repoName, files: generatedFiles, github_token: githubToken })
      });
      if (data.error) throw new Error(data.error);
      liveSpaceUrl = data.space_url;
      currentSpaceFullName = data.space_full_name;
      deployStatusSpan.innerText = `HF Space: ${data.space_url}`;
      appendToConsole(`✅ Hugging Face Space: ${data.space_url}`);
      updateStatus("Deployed to HF");
    } catch(e) { showError(e.message); updateStatus("HF deploy failed"); }
  }

  // Live logs for HF Space (polling)
  async function fetchHFSpaceLogs() {
    if (!currentSpaceFullName) return;
    try {
      const data = await safeFetch(API_HF_LOGS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ space_name: currentSpaceFullName })
      });
      if (data.logs && data.logs.length > lastLogCount) {
        const newLogs = data.logs.slice(lastLogCount);
        newLogs.forEach(entry => appendToConsole(entry.logs || JSON.stringify(entry), true));
        lastLogCount = data.logs.length;
      }
    } catch(e) { appendToConsole(`Error fetching logs: ${e.message}`, true); }
  }

  // Event listeners
  $('generateBtn')?.addEventListener('click', generate);
  $('deployGithubBtn')?.addEventListener('click', deployToGitHub);
  $('deployHfBtn')?.addEventListener('click', deployToHF);
  $('refreshReposBtn')?.addEventListener('click', fetchUserRepos);
  $('refreshFilesBtn')?.addEventListener('click', () => {
    if ($('repoSelect').value) loadRepoFiles($('repoSelect').value);
    else renderFileTree();
  });
  $('repoSelect')?.addEventListener('change', (e) => {
    if (e.target.value) loadRepoFiles(e.target.value);
  });
  $('loginBtn')?.addEventListener('click', () => window.location.href = AUTH_GITHUB);
  $('disconnectGit')?.addEventListener('click', () => {
    localStorage.removeItem('github_token');
    localStorage.removeItem('github_user');
    location.reload();
  });
  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const panel = tab.dataset.panel;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      if (panel === 'console') {
        $('consolePanel').style.display = 'block';
        $('logsPanel').style.display = 'none';
      } else {
        $('consolePanel').style.display = 'none';
        $('logsPanel').style.display = 'block';
      }
    });
  });

  // Auto-start logs polling if Space exists
  setInterval(() => {
    if (currentSpaceFullName) fetchHFSpaceLogs();
  }, 3000);

  // On load
  function handleRedirectTokens() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const user = urlParams.get('github_user');
    if (token) {
      localStorage.setItem('github_token', token);
      if (user) localStorage.setItem('github_user', user);
      window.history.replaceState({}, '', window.location.pathname);
    }
    updateAuthUI();
  }
  handleRedirectTokens();
  updateAuthUI();
</script>
</body>
</html>
