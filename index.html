<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GrishteSync – AI IDE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e1a;
      --bg-sidebar: #0f1420;
      --bg-editor: #1a1f2e;
      --bg-terminal: #0a0e1a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --accent: #10b981;
      --accent-hover: #34d399;
      --border: #2a2a3a;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --tab-active: #1a1f2e;
      --tab-inactive: #0f1420;
    }

    body.light {
      --bg-primary: #f5f5f5;
      --bg-sidebar: #e8e8e8;
      --bg-editor: #ffffff;
      --bg-terminal: #fafafa;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a5a;
      --border: #d0d0d0;
      --tab-active: #ffffff;
      --tab-inactive: #e8e8e8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    /* Main Layout */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .main-header {
      background: linear-gradient(135deg, #0a0e1a 0%, #0f1420 100%);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-area img {
      height: 36px;
      width: auto;
    }
    .logo-area h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.8rem;
    }
    .btn-outline:hover {
      background: var(--accent);
      color: white;
    }
    .github-badge {
      background: #2d3748;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    /* Workspace */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar (File Tree) */
    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 20px;
    }
    .sidebar-section {
      margin-bottom: 20px;
    }
    .sidebar-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }
    .file-tree {
      list-style: none;
    }
    .file-tree li {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fira Code', monospace;
    }
    .file-tree li:hover {
      background: var(--border);
    }
    .file-tree li.active {
      background: var(--accent);
      color: white;
    }
    .repo-selector {
      width: 100%;
      padding: 6px 8px;
      background: var(--bg-editor);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.8rem;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 0.7rem;
    }

    /* Main Content (Editor + Console) */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      padding: 8px 16px;
      background: var(--tab-inactive);
      border-right: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--tab-active);
      border-bottom: 2px solid var(--accent);
    }
    .tab .close-tab {
      cursor: pointer;
      opacity: 0.6;
      font-size: 0.7rem;
    }
    .tab .close-tab:hover {
      opacity: 1;
    }

    /* Editor Area */
    .editor-area {
      flex: 2;
      overflow: auto;
    }
    .editor-container {
      height: 100%;
      width: 100%;
    }
    .editor-container textarea {
      width: 100%;
      height: 100%;
      background: var(--bg-editor);
      color: var(--text-primary);
      border: none;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      padding: 16px;
      resize: none;
      outline: none;
    }

    /* Bottom Console */
    .console-panel {
      background: var(--bg-terminal);
      border-top: 1px solid var(--border);
      height: 280px;
      display: flex;
      flex-direction: column;
    }
    .console-header {
      padding: 8px 12px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .console-output {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .console-actions {
      display: flex;
      gap: 8px;
    }

    /* Right Panel (Deployments) */
    .right-panel {
      width: 280px;
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
    }
    .deployment-card {
      background: var(--bg-editor);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .deployment-card h4 {
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .deployment-card .timestamp {
      font-size: 0.65rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .deployment-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .deployment-links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.7rem;
    }

    @media (max-width: 768px) {
      .sidebar { width: 200px; }
      .right-panel { width: 240px; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="main-header">
    <div class="logo-area">
      <img src="https://i.ibb.co/B5z2c7j7/1781241361720.png" alt="Logo">
      <h1>GrishteSync IDE</h1>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="btn-outline"><i class="fas fa-moon"></i> Theme</button>
      <button id="loginBtn" class="btn-outline" style="display:none;"><i class="fab fa-github"></i> Connect</button>
      <span id="gitBadge" style="display:none;" class="github-badge"><i class="fab fa-github"></i> <span id="gitUser"></span> <i id="disconnectGit" class="fas fa-times-circle" style="cursor:pointer;"></i></span>
    </div>
  </div>

  <div class="workspace">
    <!-- Left Sidebar: File Tree & Repo -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title"><i class="fas fa-folder-open"></i> Explorer</div>
        <div id="fileTree" class="file-tree">
          <li style="color: var(--text-secondary);"><i class="fas fa-info-circle"></i> Generate an app to see files</li>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title"><i class="fab fa-github"></i> Repository</div>
        <select id="repoSelect" class="repo-selector">
          <option>-- Select repo --</option>
        </select>
        <button id="refreshReposBtn" class="btn-outline btn-sm" style="margin-top: 8px; width:100%;">↻ Refresh Repos</button>
        <div class="sidebar-title" style="margin-top: 16px;"><i class="fas fa-microchip"></i> AI Mode</div>
        <select id="promptTypeSelect" class="repo-selector">
          <option value="generate">✨ Generate</option>
          <option value="fix">🔧 Fix</option>
          <option value="improve_ui">🎨 Improve UI</option>
          <option value="add_feature">➕ Add feature</option>
          <option value="refactor">📦 Refactor</option>
          <option value="diagnose">🩺 Diagnose</option>
        </select>
        <input type="text" id="appNameInput" placeholder="App name" class="repo-selector" style="margin-top: 8px;">
        <textarea id="promptInput" rows="3" placeholder="Describe your app..." class="repo-selector" style="margin-top: 8px;"></textarea>
        <button id="generateBtn" class="btn-outline btn-sm" style="margin-top: 8px; width:100%; background: var(--accent); color:white;">🚀 Generate</button>
        <div id="errorBox" style="font-size:0.7rem; margin-top:8px; color: var(--error); display:none;"></div>
      </div>
    </div>

    <!-- Main Content: Editor + Console -->
    <div class="main-content">
      <!-- Tabs -->
      <div class="tabs" id="tabsContainer"></div>
      <!-- Editor -->
      <div class="editor-area">
        <div id="editorContainer" class="editor-container">
          <textarea id="editor" placeholder="Select a file from the tree to edit..."></textarea>
        </div>
      </div>
      <!-- Console -->
      <div class="console-panel">
        <div class="console-header">
          <span><i class="fas fa-terminal"></i> Live Console</span>
          <div class="console-actions">
            <button id="clearConsoleBtn" class="btn-outline btn-sm">Clear</button>
            <button id="diagnoseConsoleBtn" class="btn-outline btn-sm">🩺 Diagnose</button>
            <button id="deployGithubBtn" class="btn-outline btn-sm" style="display:none;"><i class="fab fa-github"></i> Deploy GH</button>
            <button id="deployHfBtn" class="btn-outline btn-sm"><i class="fab fa-huggingface"></i> Deploy HF</button>
          </div>
        </div>
        <pre id="consoleOutput" class="console-output">Ready.</pre>
      </div>
    </div>

    <!-- Right Panel: Deployments -->
    <div class="right-panel">
      <div class="sidebar-title"><i class="fas fa-history"></i> Deployments</div>
      <div id="deploymentsList"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  // ---------- Configuration ----------
  const API_BASE = "https://grishtesync-backend.onrender.com";
  const API_GENERATE = `${API_BASE}/api/generate`;
  const API_DEPLOY = `${API_BASE}/api/deploy`;
  const API_DEPLOY_HF = `${API_BASE}/api/deploy-hf`;
  const API_REPO_FILES = `${API_BASE}/api/repo-files`;
  const API_HF_LOGS = `${API_BASE}/api/hf-logs`;
  const API_DIAGNOSE = `${API_BASE}/api/diagnose`;
  const AUTH_GITHUB = `${API_BASE}/auth/login`;

  // Global state
  let generatedFiles = {};           // filename -> content
  let currentFile = null;
  let openTabs = [];                 // list of filenames
  let activeTab = null;
  let githubToken = localStorage.getItem("github_token") || null;
  let githubUsername = localStorage.getItem("github_user") || null;
  let deployments = JSON.parse(localStorage.getItem("deployments") || "[]");
  let repoName = "";
  let currentVersion = "0.0.0";
  let consoleInterval = null;
  let currentSpaceFullName = null;

  // DOM elements
  const $ = id => document.getElementById(id);
  const editor = $('editor');
  const tabsContainer = $('tabsContainer');
  const fileTree = $('fileTree');
  const consoleOutput = $('consoleOutput');
  const deploymentsList = $('deploymentsList');
  const repoSelect = $('repoSelect');
  const appNameInput = $('appNameInput');
  const promptInput = $('promptInput');
  const promptTypeSelect = $('promptTypeSelect');
  const generateBtn = $('generateBtn');
  const deployGithubBtn = $('deployGithubBtn');
  const deployHfBtn = $('deployHfBtn');
  const loginBtn = $('loginBtn');
  const gitBadge = $('gitBadge');
  const gitUser = $('gitUser');
  const disconnectGit = $('disconnectGit');
  const themeToggle = $('themeToggle');
  const errorBox = $('errorBox');
  const diagnoseConsoleBtn = $('diagnoseConsoleBtn');
  const clearConsoleBtn = $('clearConsoleBtn');
  const refreshReposBtn = $('refreshReposBtn');

  // Helper: append to console
  function appendToConsole(msg) {
    consoleOutput.innerText += msg + '\n';
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function showError(msg) { errorBox.style.display = 'block'; errorBox.innerText = msg; setTimeout(() => errorBox.style.display = 'none', 5000); }

  // Render file tree (left sidebar)
  function renderFileTree() {
    fileTree.innerHTML = '';
    if (Object.keys(generatedFiles).length === 0) {
      fileTree.innerHTML = '<li style="color: var(--text-secondary);"><i class="fas fa-info-circle"></i> No files generated</li>';
      return;
    }
    for (const filename of Object.keys(generatedFiles).sort()) {
      const li = document.createElement('li');
      li.innerHTML = `<i class="far fa-file-code"></i> ${filename}`;
      li.onclick = () => openFile(filename);
      if (activeTab === filename) li.classList.add('active');
      fileTree.appendChild(li);
    }
  }

  // Open a file in the editor and add a tab
  function openFile(filename) {
    if (!generatedFiles[filename]) return;
    if (!openTabs.includes(filename)) {
      openTabs.push(filename);
    }
    activeTab = filename;
    currentFile = filename;
    editor.value = generatedFiles[filename];
    renderTabs();
    renderFileTree();
  }

  // Save current editor content to generatedFiles
  function saveCurrentFile() {
    if (activeTab && generatedFiles[activeTab] !== undefined) {
      generatedFiles[activeTab] = editor.value;
      appendToConsole(`✅ Saved ${activeTab}`);
    }
  }

  // Render tabs
  function renderTabs() {
    tabsContainer.innerHTML = '';
    for (const filename of openTabs) {
      const tab = document.createElement('div');
      tab.className = 'tab' + (activeTab === filename ? ' active' : '');
      tab.innerHTML = `
        <span><i class="far fa-file"></i> ${filename}</span>
        <span class="close-tab" data-filename="${filename}"><i class="fas fa-times-circle"></i></span>
      `;
      tab.onclick = (e) => {
        if (e.target.classList.contains('close-tab')) return;
        openFile(filename);
      };
      const closeBtn = tab.querySelector('.close-tab');
      closeBtn.onclick = (e) => {
        e.stopPropagation();
        const idx = openTabs.indexOf(filename);
        if (idx !== -1) openTabs.splice(idx, 1);
        if (activeTab === filename) {
          if (openTabs.length > 0) openFile(openTabs[0]);
          else {
            activeTab = null;
            currentFile = null;
            editor.value = '';
            renderTabs();
            renderFileTree();
          }
        } else {
          renderTabs();
        }
        renderFileTree();
      };
      tabsContainer.appendChild(tab);
    }
    if (openTabs.length === 0) {
      editor.value = '';
    }
  }

  // After generation, populate files and open first one
  function afterGeneration(files) {
    generatedFiles = files;
    openTabs = [];
    activeTab = null;
    const filenames = Object.keys(files);
    if (filenames.length) {
      openTabs = [...filenames];
      activeTab = filenames[0];
      editor.value = files[filenames[0]];
    }
    renderTabs();
    renderFileTree();
    appendToConsole(`✅ Generated ${filenames.length} files. Click on any file to edit.`);
  }

  // Save deployment record
  function saveDeployment(deployment) {
    deployments.unshift(deployment);
    if (deployments.length > 10) deployments.pop();
    localStorage.setItem("deployments", JSON.stringify(deployments));
    renderDeployments();
  }

  function renderDeployments() {
    if (!deploymentsList) return;
    if (deployments.length === 0) {
      deploymentsList.innerHTML = '<div style="text-align:center; color:var(--text-secondary);">No deployments yet</div>';
      return;
    }
    deploymentsList.innerHTML = deployments.map(d => `
      <div class="deployment-card">
        <h4>${d.appName}</h4>
        <div class="timestamp">${new Date(d.timestamp).toLocaleString()}</div>
        <div class="deployment-links">
          ${d.githubUrl ? `<a href="${d.githubUrl}" target="_blank"><i class="fab fa-github"></i> Repo</a>` : ''}
          ${d.prUrl ? `<a href="${d.prUrl}" target="_blank"><i class="fas fa-code-branch"></i> PR</a>` : ''}
          ${d.pagesUrl ? `<a href="${d.pagesUrl}" target="_blank"><i class="fas fa-globe"></i> Pages</a>` : ''}
          ${d.hfUrl ? `<a href="${d.hfUrl}" target="_blank"><i class="fab fa-huggingface"></i> Space</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  // API calls
  async function safeFetch(url, options) {
    const res = await fetch(url, options);
    const text = await res.text();
    try { return JSON.parse(text); } catch(e) { throw new Error(`Server error: ${text.slice(0,200)}`); }
  }

  async function generate() {
    const appName = appNameInput.value.trim();
    if (!appName) return showError("Enter an app name");
    const prompt = promptInput.value.trim();
    if (!prompt) return showError("Describe your app");
    const promptType = promptTypeSelect.value;
    repoName = `GrishteSync-${appName}`;
    generateBtn.disabled = true;
    generateBtn.innerText = '⏳ Generating...';
    appendToConsole(`🚀 Generating app from prompt: "${prompt}"`);
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (githubToken) headers['Authorization'] = `token ${githubToken}`;
      const data = await safeFetch(API_GENERATE, {
        method: 'POST',
        headers,
        body: JSON.stringify({ prompt, prompt_type: promptType, repo: repoSelect.value })
      });
      if (data.error) throw new Error(data.error);
      afterGeneration(data.files);
      appendToConsole(`✨ Generation completed in ${data.generate_time}s`);
    } catch(e) {
      appendToConsole(`❌ Generation failed: ${e.message}`);
      showError(e.message);
    } finally {
      generateBtn.disabled = false;
      generateBtn.innerText = '🚀 Generate';
    }
  }

  async function deployToGitHub() {
    if (!githubToken) return appendToConsole("❌ Connect GitHub first");
    if (Object.keys(generatedFiles).length === 0) return appendToConsole("❌ No files to deploy");
    saveCurrentFile();
    deployGithubBtn.disabled = true;
    deployGithubBtn.innerText = '⏳ Deploying...';
    appendToConsole("📦 Deploying to GitHub...");
    try {
      const data = await safeFetch(API_DEPLOY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `token ${githubToken}` },
        body: JSON.stringify({ repo_name: repoName, files: generatedFiles, version: currentVersion })
      });
      if (data.error) throw new Error(data.error);
      saveDeployment({
        appName: appNameInput.value.trim(),
        timestamp: Date.now(),
        githubUrl: data.repo_url,
        prUrl: data.pr_url,
        pagesUrl: data.pages_url,
        status: 'building'
      });
      appendToConsole(`✅ Deployed to GitHub: ${data.repo_url}`);
      if (data.pr_url) appendToConsole(`🔀 Pull Request: ${data.pr_url}`);
      if (data.pages_url) appendToConsole(`🌐 GitHub Pages: ${data.pages_url}`);
    } catch(e) {
      appendToConsole(`❌ GitHub deploy failed: ${e.message}`);
    } finally {
      deployGithubBtn.disabled = false;
      deployGithubBtn.innerText = '🐙 Deploy GH';
    }
  }

  async function deployToHF() {
    if (Object.keys(generatedFiles).length === 0) return appendToConsole("❌ No files to deploy");
    saveCurrentFile();
    deployHfBtn.disabled = true;
    deployHfBtn.innerText = '⏳ Deploying...';
    appendToConsole("🤗 Deploying to Hugging Face...");
    try {
      const data = await safeFetch(API_DEPLOY_HF, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repo_full_name: repoName, files: generatedFiles })
      });
      if (data.error) throw new Error(data.error);
      currentSpaceFullName = data.space_full_name;
      saveDeployment({
        appName: appNameInput.value.trim(),
        timestamp: Date.now(),
        hfUrl: data.space_url,
        status: 'live'
      });
      appendToConsole(`✅ Hugging Face Space: ${data.space_url}`);
      // Start polling logs
      if (consoleInterval) clearInterval(consoleInterval);
      consoleInterval = setInterval(async () => {
        try {
          const logs = await safeFetch(API_HF_LOGS, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ space_name: currentSpaceFullName }) });
          if (logs.logs) appendToConsole(logs.logs);
        } catch(e) {}
      }, 4000);
    } catch(e) {
      appendToConsole(`❌ HF deploy failed: ${e.message}`);
    } finally {
      deployHfBtn.disabled = false;
      deployHfBtn.innerText = '🤗 Deploy HF';
    }
  }

  async function diagnoseFromConsole() {
    const logs = consoleOutput.innerText;
    const code = activeTab ? generatedFiles[activeTab] : (Object.values(generatedFiles)[0] || '');
    if (!logs || logs === 'Ready.') return appendToConsole("No logs to diagnose");
    appendToConsole("🩺 Running diagnosis...");
    try {
      const data = await safeFetch(API_DIAGNOSE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ error_log: logs, code: code })
      });
      if (data.error) throw new Error(data.error);
      afterGeneration(data.files);
      appendToConsole("✅ Diagnosis complete. Fixed code loaded in editor.");
    } catch(e) {
      appendToConsole(`❌ Diagnosis failed: ${e.message}`);
    }
  }

  // Auth UI
  function updateAuthUI() {
    if (githubToken) {
      loginBtn.style.display = 'none';
      gitBadge.style.display = 'inline-flex';
      gitUser.innerText = githubUsername || 'user';
      deployGithubBtn.style.display = 'inline-block';
    } else {
      loginBtn.style.display = 'inline-block';
      gitBadge.style.display = 'none';
      deployGithubBtn.style.display = 'none';
    }
  }

  async function fetchUserRepos() {
    if (!githubToken) return;
    try {
      const repos = await safeFetch('https://api.github.com/user/repos?per_page=100', { headers: { Authorization: `token ${githubToken}` } });
      const grishteRepos = repos.filter(r => r.name.toLowerCase().startsWith('grishtesync-'));
      repoSelect.innerHTML = '<option value="">-- Select repo --</option>';
      grishteRepos.forEach(repo => {
        const opt = document.createElement('option');
        opt.value = repo.full_name;
        opt.textContent = repo.full_name;
        repoSelect.appendChild(opt);
      });
    } catch(e) { console.error(e); }
  }

  // Event listeners
  generateBtn.onclick = generate;
  deployGithubBtn.onclick = deployToGitHub;
  deployHfBtn.onclick = deployToHF;
  diagnoseConsoleBtn.onclick = diagnoseFromConsole;
  clearConsoleBtn.onclick = () => { consoleOutput.innerText = ''; };
  refreshReposBtn.onclick = fetchUserRepos;
  loginBtn.onclick = () => window.location.href = AUTH_GITHUB;
  disconnectGit.onclick = () => {
    localStorage.removeItem('github_token');
    localStorage.removeItem('github_user');
    location.reload();
  };
  themeToggle.onclick = () => {
    document.body.classList.toggle('light');
    localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
  };
  // Auto-save on editor blur
  editor.addEventListener('blur', saveCurrentFile);

  // Initialization
  function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') document.body.classList.add('light');
  }
  function handleRedirectTokens() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const user = params.get('github_user');
    if (token) {
      localStorage.setItem('github_token', token);
      if (user) localStorage.setItem('github_user', user);
      window.history.replaceState({}, '', window.location.pathname);
      location.reload();
    }
  }
  handleRedirectTokens();
  updateAuthUI();
  initTheme();
  renderDeployments();
  if (githubToken) fetchUserRepos();
  appendToConsole("GrishteSync IDE ready. Connect GitHub and generate an app.");
</script>
</body>
</html>
