<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>GrishteSync – Mobile IDE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0e1a;
      --bg-sidebar: #0f1420;
      --bg-editor: #1a1f2e;
      --bg-terminal: #0a0e1a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --accent: #10b981;
      --border: #2a2a3a;
      --tab-active: #1a1f2e;
      --tab-inactive: #0f1420;
    }

    body.light {
      --bg-primary: #f5f5f5;
      --bg-sidebar: #e8e8e8;
      --bg-editor: #ffffff;
      --bg-terminal: #fafafa;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a5a;
      --border: #d0d0d0;
      --tab-active: #ffffff;
      --tab-inactive: #e8e8e8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    /* Main layout */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .main-header {
      background: linear-gradient(135deg, #0a0e1a 0%, #0f1420 100%);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-area img {
      height: 32px;
      width: auto;
    }
    .logo-area h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-outline, .btn-sm {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: 0.2s;
    }
    .btn-outline:hover {
      background: var(--accent);
      color: white;
    }
    .github-badge {
      background: #2d3748;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .hamburger {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.4rem;
      cursor: pointer;
      display: none;
    }

    /* Mobile drawer (sidebar + right panel) */
    .mobile-drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: var(--bg-sidebar);
      z-index: 1000;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }
    .mobile-drawer.open {
      left: 0;
    }
    .drawer-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
    }
    .drawer-backdrop.show {
      display: block;
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .drawer-close {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Main workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
    }
    .tab {
      padding: 8px 12px;
      background: var(--tab-inactive);
      border-right: 1px solid var(--border);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
    }
    .tab.active {
      background: var(--tab-active);
      border-bottom: 2px solid var(--accent);
    }
    .close-tab {
      cursor: pointer;
      opacity: 0.6;
    }

    /* Editor */
    .editor-area {
      flex: 2;
      overflow: auto;
    }
    .editor-container textarea {
      width: 100%;
      height: 100%;
      background: var(--bg-editor);
      color: var(--text-primary);
      border: none;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      padding: 12px;
      resize: none;
      outline: none;
    }

    /* Console panel */
    .console-panel {
      background: var(--bg-terminal);
      border-top: 1px solid var(--border);
      height: 240px;
      display: flex;
      flex-direction: column;
    }
    .console-header {
      padding: 6px 12px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .console-output {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      white-space: pre-wrap;
    }
    .console-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Right panel (deployments) – also in drawer on mobile, but we'll keep inline on desktop */
    .right-panel {
      width: 260px;
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
    }
    .deployment-card {
      background: var(--bg-editor);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .deployment-card h4 { font-size: 0.85rem; margin-bottom: 4px; }
    .deployment-card .timestamp { font-size: 0.6rem; color: var(--text-secondary); }
    .deployment-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .deployment-links a { color: var(--accent); font-size: 0.7rem; text-decoration: none; }

    /* Desktop 3‑column layout */
    .desktop-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
    }
    .sidebar-section {
      margin-bottom: 20px;
    }
    .sidebar-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-secondary);
    }
    .file-tree {
      list-style: none;
    }
    .file-tree li {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: monospace;
    }
    .file-tree li:hover { background: var(--border); }
    .file-tree li.active { background: var(--accent); color: white; }
    .repo-selector, .app-name-input, .prompt-textarea {
      width: 100%;
      padding: 8px;
      background: var(--bg-editor);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.8rem;
      margin-bottom: 8px;
    }
    .prompt-textarea {
      font-family: inherit;
      resize: vertical;
    }
    .generate-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Media queries */
    @media (max-width: 768px) {
      .desktop-layout .sidebar, .desktop-layout .right-panel {
        display: none;
      }
      .hamburger {
        display: block;
      }
      .mobile-drawer {
        display: flex;
      }
      .right-panel {
        position: fixed;
        right: -280px;
        transition: right 0.3s ease;
        z-index: 1000;
      }
      .right-panel.open {
        right: 0;
      }
      .main-header {
        padding: 8px 12px;
      }
      .tab {
        padding: 6px 10px;
        font-size: 0.7rem;
      }
      .console-panel {
        height: 200px;
      }
      .editor-container textarea {
        font-size: 11px;
      }
    }
    @media (min-width: 769px) {
      .mobile-drawer, .drawer-backdrop {
        display: none !important;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="main-header">
    <div class="logo-area">
      <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
      <img src="https://i.ibb.co/B5z2c7j7/1781241361720.png" alt="Logo">
      <h1>GrishteSync IDE</h1>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="btn-outline"><i class="fas fa-moon"></i></button>
      <button id="loginBtn" class="btn-outline" style="display:none;"><i class="fab fa-github"></i> Connect</button>
      <span id="gitBadge" style="display:none;" class="github-badge"><i class="fab fa-github"></i> <span id="gitUser"></span> <i id="disconnectGit" class="fas fa-times-circle" style="cursor:pointer;"></i></span>
    </div>
  </div>

  <!-- Mobile drawer (left) -->
  <div id="mobileDrawer" class="mobile-drawer">
    <div class="drawer-header">
      <span><i class="fas fa-folder-open"></i> Explorer</span>
      <button class="drawer-close" id="closeDrawerBtn"><i class="fas fa-times"></i></button>
    </div>
    <div id="mobileFileTree" class="file-tree"></div>
    <div class="sidebar-title" style="margin-top: 20px;"><i class="fab fa-github"></i> Repository</div>
    <select id="mobileRepoSelect" class="repo-selector"></select>
    <button id="mobileRefreshRepos" class="btn-outline" style="margin-bottom: 12px;">↻ Refresh</button>
    <div class="sidebar-title"><i class="fas fa-microchip"></i> AI Mode</div>
    <select id="mobilePromptType" class="repo-selector">
      <option value="generate">✨ Generate</option>
      <option value="fix">🔧 Fix</option>
      <option value="improve_ui">🎨 Improve UI</option>
      <option value="add_feature">➕ Add feature</option>
      <option value="refactor">📦 Refactor</option>
      <option value="diagnose">🩺 Diagnose</option>
    </select>
    <input type="text" id="mobileAppName" placeholder="App name" class="repo-selector">
    <textarea id="mobilePrompt" rows="3" placeholder="Describe your app..." class="prompt-textarea"></textarea>
    <button id="mobileGenerateBtn" class="generate-btn">🚀 Generate</button>
  </div>
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <!-- Mobile right panel (deployments) -->
  <div id="mobileRightPanel" class="right-panel" style="position: fixed; right: -280px; top: 0; height: 100%; z-index: 1000;">
    <div class="drawer-header">
      <span><i class="fas fa-history"></i> Deployments</span>
      <button class="drawer-close" id="closeRightPanelBtn"><i class="fas fa-times"></i></button>
    </div>
    <div id="mobileDeploymentsList"></div>
  </div>

  <!-- Desktop layout (visible on >768px) -->
  <div class="desktop-layout">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title"><i class="fas fa-folder-open"></i> Explorer</div>
        <div id="fileTree" class="file-tree"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title"><i class="fab fa-github"></i> Repository</div>
        <select id="repoSelect" class="repo-selector"></select>
        <button id="refreshReposBtn" class="btn-outline" style="margin-top: 6px; width:100%;">↻ Refresh</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title"><i class="fas fa-microchip"></i> AI Mode</div>
        <select id="promptTypeSelect" class="repo-selector">
          <option value="generate">✨ Generate</option>
          <option value="fix">🔧 Fix</option>
          <option value="improve_ui">🎨 Improve UI</option>
          <option value="add_feature">➕ Add feature</option>
          <option value="refactor">📦 Refactor</option>
          <option value="diagnose">🩺 Diagnose</option>
        </select>
        <input type="text" id="appNameInput" placeholder="App name" class="repo-selector" style="margin-top: 8px;">
        <textarea id="promptInput" rows="3" placeholder="Describe your app..." class="prompt-textarea"></textarea>
        <button id="generateBtn" class="generate-btn">🚀 Generate</button>
      </div>
    </div>

    <div class="workspace">
      <div class="tabs" id="tabsContainer"></div>
      <div class="editor-area">
        <div class="editor-container">
          <textarea id="editor" placeholder="Select a file to edit..."></textarea>
        </div>
      </div>
      <div class="console-panel">
        <div class="console-header">
          <span><i class="fas fa-terminal"></i> Live Console</span>
          <div class="console-actions">
            <button id="clearConsoleBtn" class="btn-outline btn-sm">Clear</button>
            <button id="diagnoseConsoleBtn" class="btn-outline btn-sm">🩺 Diagnose</button>
            <button id="deployGithubBtn" class="btn-outline btn-sm" style="display:none;"><i class="fab fa-github"></i> Deploy GH</button>
            <button id="deployHfBtn" class="btn-outline btn-sm"><i class="fab fa-huggingface"></i> Deploy HF</button>
          </div>
        </div>
        <pre id="consoleOutput" class="console-output">Ready.</pre>
      </div>
    </div>

    <div class="right-panel">
      <div class="sidebar-title"><i class="fas fa-history"></i> Deployments</div>
      <div id="deploymentsList"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  // ---------- Configuration ----------
  const API_BASE = "https://grishtesync-backend.onrender.com";
  const API_GENERATE = `${API_BASE}/api/generate`;
  const API_DEPLOY = `${API_BASE}/api/deploy`;
  const API_DEPLOY_HF = `${API_BASE}/api/deploy-hf`;
  const API_REPO_FILES = `${API_BASE}/api/repo-files`;
  const API_HF_LOGS = `${API_BASE}/api/hf-logs`;
  const API_DIAGNOSE = `${API_BASE}/api/diagnose`;
  const AUTH_GITHUB = `${API_BASE}/auth/login`;

  let generatedFiles = {};
  let activeTab = null;
  let openTabs = [];
  let githubToken = localStorage.getItem("github_token") || null;
  let githubUsername = localStorage.getItem("github_user") || null;
  let deployments = JSON.parse(localStorage.getItem("deployments") || "[]");
  let repoName = "";
  let currentVersion = "0.0.0";
  let consoleInterval = null;
  let currentSpaceFullName = null;

  // DOM elements (desktop)
  const $ = id => document.getElementById(id);
  const editor = $('editor');
  const tabsContainer = $('tabsContainer');
  const fileTree = $('fileTree');
  const consoleOutput = $('consoleOutput');
  const deploymentsList = $('deploymentsList');
  const repoSelect = $('repoSelect');
  const appNameInput = $('appNameInput');
  const promptInput = $('promptInput');
  const promptTypeSelect = $('promptTypeSelect');
  const generateBtn = $('generateBtn');
  const deployGithubBtn = $('deployGithubBtn');
  const deployHfBtn = $('deployHfBtn');
  const loginBtn = $('loginBtn');
  const gitBadge = $('gitBadge');
  const gitUser = $('gitUser');
  const disconnectGit = $('disconnectGit');
  const themeToggle = $('themeToggle');
  const diagnoseConsoleBtn = $('diagnoseConsoleBtn');
  const clearConsoleBtn = $('clearConsoleBtn');
  const refreshReposBtn = $('refreshReposBtn');

  // Mobile elements
  const mobileFileTree = $('mobileFileTree');
  const mobileRepoSelect = $('mobileRepoSelect');
  const mobileRefreshRepos = $('mobileRefreshRepos');
  const mobilePromptType = $('mobilePromptType');
  const mobileAppName = $('mobileAppName');
  const mobilePrompt = $('mobilePrompt');
  const mobileGenerateBtn = $('mobileGenerateBtn');
  const mobileDeploymentsList = $('mobileDeploymentsList');

  function appendToConsole(msg) {
    consoleOutput.innerText += msg + '\n';
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function showError(msg) { alert(msg); }

  // File tree rendering (both desktop and mobile)
  function renderFileTree() {
    const render = (container) => {
      container.innerHTML = '';
      if (Object.keys(generatedFiles).length === 0) {
        container.innerHTML = '<div style="padding:8px; color:var(--text-secondary);">No files</div>';
        return;
      }
      for (const filename of Object.keys(generatedFiles).sort()) {
        const div = document.createElement('div');
        div.className = 'file-tree-item';
        div.style.padding = '6px 8px';
        div.style.cursor = 'pointer';
        div.style.borderRadius = '6px';
        div.innerHTML = `<i class="far fa-file-code"></i> ${filename}`;
        div.onclick = () => openFile(filename);
        if (activeTab === filename) div.style.background = 'var(--accent)';
        container.appendChild(div);
      }
    };
    render(fileTree);
    if (mobileFileTree) render(mobileFileTree);
  }

  function openFile(filename) {
    if (!generatedFiles[filename]) return;
    if (!openTabs.includes(filename)) openTabs.push(filename);
    activeTab = filename;
    editor.value = generatedFiles[filename];
    renderTabs();
    renderFileTree();
  }

  function saveCurrentFile() {
    if (activeTab && generatedFiles[activeTab] !== undefined) {
      generatedFiles[activeTab] = editor.value;
      appendToConsole(`✅ Saved ${activeTab}`);
    }
  }

  function renderTabs() {
    tabsContainer.innerHTML = '';
    for (const filename of openTabs) {
      const tab = document.createElement('div');
      tab.className = 'tab' + (activeTab === filename ? ' active' : '');
      tab.innerHTML = `
        <span><i class="far fa-file"></i> ${filename}</span>
        <span class="close-tab" data-filename="${filename}"><i class="fas fa-times-circle"></i></span>
      `;
      tab.onclick = (e) => {
        if (e.target.classList.contains('close-tab')) return;
        openFile(filename);
      };
      const closeBtn = tab.querySelector('.close-tab');
      closeBtn.onclick = (e) => {
        e.stopPropagation();
        openTabs = openTabs.filter(f => f !== filename);
        if (activeTab === filename) {
          activeTab = openTabs[0] || null;
          editor.value = activeTab ? generatedFiles[activeTab] : '';
        }
        renderTabs();
        renderFileTree();
      };
      tabsContainer.appendChild(tab);
    }
    if (openTabs.length === 0) editor.value = '';
  }

  function afterGeneration(files) {
    generatedFiles = files;
    openTabs = [];
    activeTab = null;
    const filenames = Object.keys(files);
    if (filenames.length) {
      openTabs = [...filenames];
      activeTab = filenames[0];
      editor.value = files[filenames[0]];
    }
    renderTabs();
    renderFileTree();
    appendToConsole(`✅ Generated ${filenames.length} files.`);
  }

  function saveDeployment(deployment) {
    deployments.unshift(deployment);
    if (deployments.length > 10) deployments.pop();
    localStorage.setItem("deployments", JSON.stringify(deployments));
    renderDeployments();
  }

  function renderDeployments() {
    const render = (container) => {
      if (!container) return;
      if (deployments.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-secondary);">No deployments</div>';
        return;
      }
      container.innerHTML = deployments.map(d => `
        <div class="deployment-card">
          <h4>${d.appName}</h4>
          <div class="timestamp">${new Date(d.timestamp).toLocaleString()}</div>
          <div class="deployment-links">
            ${d.githubUrl ? `<a href="${d.githubUrl}" target="_blank"><i class="fab fa-github"></i> Repo</a>` : ''}
            ${d.prUrl ? `<a href="${d.prUrl}" target="_blank"><i class="fas fa-code-branch"></i> PR</a>` : ''}
            ${d.pagesUrl ? `<a href="${d.pagesUrl}" target="_blank"><i class="fas fa-globe"></i> Pages</a>` : ''}
            ${d.hfUrl ? `<a href="${d.hfUrl}" target="_blank"><i class="fab fa-huggingface"></i> Space</a>` : ''}
          </div>
        </div>
      `).join('');
    };
    render(deploymentsList);
    render(mobileDeploymentsList);
  }

  async function safeFetch(url, options) {
    const res = await fetch(url, options);
    const text = await res.text();
    try { return JSON.parse(text); } catch(e) { throw new Error(`Server error: ${text.slice(0,200)}`); }
  }

  async function generate() {
    const appName = (appNameInput.value || mobileAppName.value).trim();
    if (!appName) return showError("Enter app name");
    const prompt = (promptInput.value || mobilePrompt.value).trim();
    if (!prompt) return showError("Describe your app");
    const promptType = (promptTypeSelect.value || mobilePromptType.value);
    repoName = `GrishteSync-${appName}`;
    generateBtn.disabled = true;
    generateBtn.innerText = '⏳...';
    if (mobileGenerateBtn) { mobileGenerateBtn.disabled = true; mobileGenerateBtn.innerText = '⏳...'; }
    appendToConsole(`🚀 Generating: "${prompt}"`);
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (githubToken) headers['Authorization'] = `token ${githubToken}`;
      const data = await safeFetch(API_GENERATE, {
        method: 'POST',
        headers,
        body: JSON.stringify({ prompt, prompt_type: promptType, repo: repoSelect.value })
      });
      if (data.error) throw new Error(data.error);
      afterGeneration(data.files);
      appendToConsole(`✨ Done in ${data.generate_time}s`);
    } catch(e) {
      appendToConsole(`❌ Failed: ${e.message}`);
    } finally {
      generateBtn.disabled = false;
      generateBtn.innerText = '🚀 Generate';
      if (mobileGenerateBtn) { mobileGenerateBtn.disabled = false; mobileGenerateBtn.innerText = '🚀 Generate'; }
    }
  }

  async function deployToGitHub() {
    if (!githubToken) return appendToConsole("❌ Connect GitHub first");
    if (Object.keys(generatedFiles).length === 0) return appendToConsole("❌ No files");
    saveCurrentFile();
    deployGithubBtn.disabled = true;
    deployGithubBtn.innerText = '⏳...';
    appendToConsole("📦 Deploying to GitHub...");
    try {
      const data = await safeFetch(API_DEPLOY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `token ${githubToken}` },
        body: JSON.stringify({ repo_name: repoName, files: generatedFiles, version: currentVersion })
      });
      if (data.error) throw new Error(data.error);
      saveDeployment({
        appName: (appNameInput.value || mobileAppName.value).trim(),
        timestamp: Date.now(),
        githubUrl: data.repo_url,
        prUrl: data.pr_url,
        pagesUrl: data.pages_url
      });
      appendToConsole(`✅ GitHub: ${data.repo_url}`);
      if (data.pr_url) appendToConsole(`🔀 PR: ${data.pr_url}`);
      if (data.pages_url) appendToConsole(`🌐 Pages: ${data.pages_url}`);
    } catch(e) {
      appendToConsole(`❌ Deploy failed: ${e.message}`);
    } finally {
      deployGithubBtn.disabled = false;
      deployGithubBtn.innerText = '🐙 Deploy GH';
    }
  }

  async function deployToHF() {
    if (Object.keys(generatedFiles).length === 0) return appendToConsole("❌ No files");
    saveCurrentFile();
    deployHfBtn.disabled = true;
    deployHfBtn.innerText = '⏳...';
    appendToConsole("🤗 Deploying to Hugging Face...");
    try {
      const data = await safeFetch(API_DEPLOY_HF, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repo_full_name: repoName, files: generatedFiles })
      });
      if (data.error) throw new Error(data.error);
      currentSpaceFullName = data.space_full_name;
      saveDeployment({
        appName: (appNameInput.value || mobileAppName.value).trim(),
        timestamp: Date.now(),
        hfUrl: data.space_url
      });
      appendToConsole(`✅ HF Space: ${data.space_url}`);
      if (consoleInterval) clearInterval(consoleInterval);
      consoleInterval = setInterval(async () => {
        try {
          const logs = await safeFetch(API_HF_LOGS, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ space_name: currentSpaceFullName }) });
          if (logs.logs) appendToConsole(logs.logs);
        } catch(e) {}
      }, 4000);
    } catch(e) {
      appendToConsole(`❌ HF deploy failed: ${e.message}`);
    } finally {
      deployHfBtn.disabled = false;
      deployHfBtn.innerText = '🤗 Deploy HF';
    }
  }

  async function diagnoseFromConsole() {
    const logs = consoleOutput.innerText;
    const code = activeTab ? generatedFiles[activeTab] : (Object.values(generatedFiles)[0] || '');
    if (!logs || logs === 'Ready.') return appendToConsole("No logs");
    appendToConsole("🩺 Diagnosing...");
    try {
      const data = await safeFetch(API_DIAGNOSE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ error_log: logs, code })
      });
      if (data.error) throw new Error(data.error);
      afterGeneration(data.files);
      appendToConsole("✅ Fixed code loaded.");
    } catch(e) {
      appendToConsole(`❌ Diagnosis failed: ${e.message}`);
    }
  }

  // Auth UI
  function updateAuthUI() {
    if (githubToken) {
      loginBtn.style.display = 'none';
      gitBadge.style.display = 'inline-flex';
      gitUser.innerText = githubUsername || 'user';
      deployGithubBtn.style.display = 'inline-block';
    } else {
      loginBtn.style.display = 'inline-block';
      gitBadge.style.display = 'none';
      deployGithubBtn.style.display = 'none';
    }
  }

  async function fetchUserRepos() {
    if (!githubToken) return;
    try {
      const repos = await safeFetch('https://api.github.com/user/repos?per_page=100', { headers: { Authorization: `token ${githubToken}` } });
      const grishteRepos = repos.filter(r => r.name.toLowerCase().startsWith('grishtesync-'));
      const options = '<option value="">-- Select repo --</option>' + grishteRepos.map(r => `<option value="${r.full_name}">${r.full_name}</option>`).join('');
      repoSelect.innerHTML = options;
      if (mobileRepoSelect) mobileRepoSelect.innerHTML = options;
    } catch(e) { console.error(e); }
  }

  editor.addEventListener('blur', saveCurrentFile);

  generateBtn.onclick = generate;
  if (mobileGenerateBtn) mobileGenerateBtn.onclick = generate;
  deployGithubBtn.onclick = deployToGitHub;
  deployHfBtn.onclick = deployToHF;
  diagnoseConsoleBtn.onclick = diagnoseFromConsole;
  clearConsoleBtn.onclick = () => { consoleOutput.innerText = ''; };
  refreshReposBtn.onclick = fetchUserRepos;
  if (mobileRefreshRepos) mobileRefreshRepos.onclick = fetchUserRepos;
  loginBtn.onclick = () => window.location.href = AUTH_GITHUB;
  disconnectGit.onclick = () => {
    localStorage.removeItem('github_token');
    localStorage.removeItem('github_user');
    location.reload();
  };
  themeToggle.onclick = () => {
    document.body.classList.toggle('light');
    localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
  };

  // Mobile drawer logic
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const mobileDrawer = document.getElementById('mobileDrawer');
  const drawerBackdrop = document.getElementById('drawerBackdrop');
  const closeDrawerBtn = document.getElementById('closeDrawerBtn');
  const mobileRightPanel = document.getElementById('mobileRightPanel');
  const closeRightPanelBtn = document.getElementById('closeRightPanelBtn');
  const showRightPanel = () => {
    mobileRightPanel.classList.add('open');
    drawerBackdrop.classList.add('show');
  };
  const closeRightPanel = () => {
    mobileRightPanel.classList.remove('open');
    drawerBackdrop.classList.remove('show');
  };
  const openDrawer = () => {
    mobileDrawer.classList.add('open');
    drawerBackdrop.classList.add('show');
  };
  const closeDrawer = () => {
    mobileDrawer.classList.remove('open');
    drawerBackdrop.classList.remove('show');
  };
  if (hamburgerBtn) hamburgerBtn.onclick = openDrawer;
  if (closeDrawerBtn) closeDrawerBtn.onclick = closeDrawer;
  if (closeRightPanelBtn) closeRightPanelBtn.onclick = closeRightPanel;
  drawerBackdrop.onclick = () => { closeDrawer(); closeRightPanel(); };
  // Deployments button on mobile (if we want one)
  const showDeploymentsBtn = document.createElement('button');
  showDeploymentsBtn.className = 'btn-outline';
  showDeploymentsBtn.innerHTML = '<i class="fas fa-history"></i>';
  showDeploymentsBtn.style.marginLeft = '8px';
  showDeploymentsBtn.onclick = showRightPanel;
  document.querySelector('.header-actions').prepend(showDeploymentsBtn);

  function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') document.body.classList.add('light');
  }
  function handleRedirectTokens() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const user = params.get('github_user');
    if (token) {
      localStorage.setItem('github_token', token);
      if (user) localStorage.setItem('github_user', user);
      window.history.replaceState({}, '', window.location.pathname);
      location.reload();
    }
  }
  handleRedirectTokens();
  updateAuthUI();
  initTheme();
  renderDeployments();
  if (githubToken) fetchUserRepos();
  appendToConsole("GrishteSync IDE ready. Connect GitHub, enter app name and prompt.");
</script>
</body>
</html>
