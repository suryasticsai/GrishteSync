<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>GrishteSync – AI App Builder</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e1a;
      font-family: 'Inter', sans-serif;
      color: #e0e0e0;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .card {
      background: #0f1420;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-area img { height: 40px; }
    .logo-area h1 { font-size: 1.6rem; background: linear-gradient(135deg, #10b981, #34d399); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .btn-outline, .btn-primary, .btn-secondary {
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-outline { background: transparent; border: 1px solid #10b981; color: #10b981; }
    .btn-primary { background: #10b981; color: white; }
    .btn-secondary { background: #2a2a3a; color: #e0e0e0; }
    .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    .github-badge { background: #2d3748; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #a0a0b0; }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      background: #1a1f2e;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      color: #e0e0e0;
      font-family: inherit;
    }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 200px; }
    .file-list { background: #1a1f2e; border-radius: 12px; padding: 12px; max-height: 200px; overflow-y: auto; }
    .file-item { padding: 6px 8px; cursor: pointer; border-radius: 6px; display: flex; justify-content: space-between; }
    .file-item:hover { background: #2a2a3a; }
    .console { background: #0a0e1a; border-radius: 12px; padding: 12px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .deployment-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .deployment-links a { color: #10b981; text-decoration: none; }
    @media (max-width: 700px) { .row { flex-direction: column; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo-area">
      <img src="https://i.ibb.co/B5z2c7j7/1781241361720.png" alt="Logo">
      <h1>GrishteSync</h1>
    </div>
    <div>
      <button id="themeToggle" class="btn-outline"><i class="fas fa-moon"></i> Theme</button>
      <button id="loginBtn" class="btn-outline" style="display:none;"><i class="fab fa-github"></i> Connect</button>
      <span id="gitBadge" style="display:none;" class="github-badge"><i class="fab fa-github"></i> <span id="gitUser"></span> <i id="disconnectGit" class="fas fa-times-circle" style="cursor:pointer;"></i></span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>App Name</label>
          <input type="text" id="appNameInput" placeholder="e.g., my-cool-project">
        </div>
      </div>
      <div class="col">
        <div class="form-group">
          <label>Project Type</label>
          <select id="platformSelect">
            <option value="huggingface">🐍 Python App (HF + GitHub)</option>
            <option value="github">🌐 WebApp (HTML/CSS/JS) – GitHub only</option>
          </select>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>AI Mode</label>
      <select id="promptTypeSelect">
        <option value="generate">✨ Generate</option>
        <option value="fix">🔧 Fix</option>
        <option value="improve_ui">🎨 Improve UI</option>
        <option value="add_feature">➕ Add feature</option>
        <option value="refactor">📦 Refactor</option>
        <option value="diagnose">🩺 Diagnose</option>
      </select>
    </div>
    <div class="form-group">
      <label>Describe your app</label>
      <textarea id="promptInput" rows="3" placeholder="Example: A to-do list with local storage, dark mode and animations"></textarea>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 8px;">
      <button id="generateBtn" class="btn-primary" style="flex:1;">🚀 Generate</button>
      <button id="deployGithubBtn" class="btn-secondary" style="display:none;"><i class="fab fa-github"></i> Deploy to GitHub</button>
      <button id="deployHfBtn" class="btn-secondary" style="display:none;"><i class="fab fa-huggingface"></i> Deploy to HF</button>
    </div>
    <div id="errorBox" style="margin-top: 12px; color: #ef4444; display:none;"></div>
  </div>

  <div id="resultCard" style="display:none;">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3><i class="fas fa-code"></i> Generated Files</h3>
        <button id="downloadZipBtn" class="btn-secondary"><i class="fas fa-download"></i> ZIP</button>
      </div>
      <div id="fileList" class="file-list" style="margin-top: 12px;"></div>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between;">
      <h3><i class="fas fa-terminal"></i> Console</h3>
      <button id="clearConsoleBtn" class="btn-secondary btn-sm">Clear</button>
    </div>
    <pre id="consoleOutput" class="console" style="margin-top: 8px;">Ready.</pre>
  </div>

  <div class="card" id="deploymentsCard">
    <h3><i class="fas fa-history"></i> Recent Deployments</h3>
    <div id="deploymentsList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  // ---------- Configuration ----------
  const API_BASE = "https://grishtesync-backend.onrender.com";
  const API_GENERATE = `${API_BASE}/api/generate`;
  const API_DEPLOY = `${API_BASE}/api/deploy`;
  const API_DEPLOY_HF = `${API_BASE}/api/deploy-hf`;
  const AUTH_GITHUB = `${API_BASE}/auth/login`;

  let generatedFiles = {};
  let githubToken = localStorage.getItem("github_token") || null;
  let githubUsername = localStorage.getItem("github_user") || null;
  let deployments = JSON.parse(localStorage.getItem("deployments") || "[]");
  let repoName = "";
  let currentPlatform = "huggingface";

  const $ = id => document.getElementById(id);
  const consoleOut = $('consoleOutput');
  const fileListDiv = $('fileList');
  const resultCard = $('resultCard');
  const deployGithubBtn = $('deployGithubBtn');
  const deployHfBtn = $('deployHfBtn');
  const platformSelect = $('platformSelect');
  const generateBtn = $('generateBtn');
  const appNameInput = $('appNameInput');
  const promptInput = $('promptInput');
  const promptTypeSelect = $('promptTypeSelect');
  const loginBtn = $('loginBtn');
  const gitBadge = $('gitBadge');
  const gitUser = $('gitUser');
  const disconnectGit = $('disconnectGit');
  const themeToggle = $('themeToggle');
  const errorBox = $('errorBox');
  const clearConsoleBtn = $('clearConsoleBtn');
  const deploymentsList = $('deploymentsList');
  const downloadZipBtn = $('downloadZipBtn');

  function appendToConsole(msg) { consoleOut.innerText += msg + '\n'; consoleOut.scrollTop = consoleOut.scrollHeight; }
  function showError(msg) { errorBox.style.display = 'block'; errorBox.innerText = msg; setTimeout(() => errorBox.style.display = 'none', 5000); }

  function renderFileList() {
    fileListDiv.innerHTML = '';
    for (const [name, content] of Object.entries(generatedFiles)) {
      const div = document.createElement('div');
      div.className = 'file-item';
      div.innerHTML = `<span><i class="far fa-file-code"></i> ${name}</span> <span style="font-size:0.7rem;">${content.length} chars</span>`;
      div.onclick = () => {
        const blob = new Blob([content], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
      };
      fileListDiv.appendChild(div);
    }
  }

  function saveDeployment(deployment) {
    deployments.unshift(deployment);
    if (deployments.length > 10) deployments.pop();
    localStorage.setItem("deployments", JSON.stringify(deployments));
    renderDeployments();
  }

  function renderDeployments() {
    if (!deploymentsList) return;
    if (deployments.length === 0) { deploymentsList.innerHTML = '<div style="color:#a0a0b0;">No deployments yet</div>'; return; }
    deploymentsList.innerHTML = deployments.map(d => `
      <div style="background:#1a1f2e; border-radius:12px; padding:12px; margin-bottom:12px;">
        <div><strong>${d.appName}</strong> <span style="font-size:0.7rem;">${new Date(d.timestamp).toLocaleString()}</span></div>
        <div class="deployment-links">
          ${d.githubUrl ? `<a href="${d.githubUrl}" target="_blank"><i class="fab fa-github"></i> Repo</a>` : ''}
          ${d.prUrl ? `<a href="${d.prUrl}" target="_blank"><i class="fas fa-code-branch"></i> PR</a>` : ''}
          ${d.pagesUrl ? `<a href="${d.pagesUrl}" target="_blank"><i class="fas fa-globe"></i> Pages</a>` : ''}
          ${d.hfUrl ? `<a href="${d.hfUrl}" target="_blank"><i class="fab fa-huggingface"></i> Space</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  async function safeFetch(url, options) {
    const res = await fetch(url, options);
    const text = await res.text();
    try { return JSON.parse(text); } catch(e) { throw new Error(`Server error: ${text.slice(0,200)}`); }
  }

  async function generate() {
    const appName = appNameInput.value.trim();
    if (!appName) return showError("Enter an app name");
    const prompt = promptInput.value.trim();
    if (!prompt) return showError("Describe your app");
    const promptType = promptTypeSelect.value;
    const platform = platformSelect.value;
    currentPlatform = platform;
    repoName = `GrishteSync-${appName}`;
    generateBtn.disabled = true;
    generateBtn.innerText = '⏳ Generating...';
    appendToConsole(`🚀 Generating ${platform === 'github' ? 'WebApp' : 'Python app'} with prompt: "${prompt}"`);
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (githubToken) headers['Authorization'] = `token ${githubToken}`;
      const data = await safeFetch(API_GENERATE, {
        method: 'POST',
        headers,
        body: JSON.stringify({ prompt, prompt_type: promptType, platform, repo: '' })
      });
      if (data.error) throw new Error(data.error);
      generatedFiles = data.files;
      renderFileList();
      resultCard.style.display = 'block';
      // Enable/disable deploy buttons based on platform
      if (platform === 'github') {
        deployGithubBtn.style.display = 'inline-block';
        deployHfBtn.style.display = 'none';
      } else {
        deployGithubBtn.style.display = 'inline-block';
        deployHfBtn.style.display = 'inline-block';
      }
      appendToConsole(`✅ Generation done in ${data.generate_time}s. ${Object.keys(generatedFiles).length} files created.`);
    } catch(e) {
      appendToConsole(`❌ Generation failed: ${e.message}`);
      showError(e.message);
    } finally {
      generateBtn.disabled = false;
      generateBtn.innerText = '🚀 Generate';
    }
  }

  async function deployToGitHub() {
    if (!githubToken) return appendToConsole("❌ Connect GitHub first");
    if (!generatedFiles || Object.keys(generatedFiles).length === 0) return appendToConsole("❌ No files to deploy");
    deployGithubBtn.disabled = true;
    deployGithubBtn.innerText = '⏳ Deploying...';
    appendToConsole("📦 Deploying to GitHub...");
    try {
      const data = await safeFetch(API_DEPLOY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `token ${githubToken}` },
        body: JSON.stringify({ repo_name: repoName, files: generatedFiles, version: '0.1.0', pr_description: `Generated via GrishteSync` })
      });
      if (data.error) throw new Error(data.error);
      saveDeployment({
        appName: appNameInput.value.trim(),
        timestamp: Date.now(),
        githubUrl: data.repo_url,
        prUrl: data.pr_url,
        pagesUrl: data.pages_url
      });
      appendToConsole(`✅ GitHub repo: ${data.repo_url}`);
      if (data.pr_url) appendToConsole(`🔀 PR: ${data.pr_url}`);
      if (data.pages_url) appendToConsole(`🌐 GitHub Pages: ${data.pages_url}`);
    } catch(e) {
      appendToConsole(`❌ GitHub deploy failed: ${e.message}`);
    } finally {
      deployGithubBtn.disabled = false;
      deployGithubBtn.innerText = '🐙 Deploy to GitHub';
    }
  }

  async function deployToHF() {
    if (currentPlatform === 'github') return appendToConsole("❌ WebApp cannot be deployed to Hugging Face");
    if (!generatedFiles || Object.keys(generatedFiles).length === 0) return appendToConsole("❌ No files to deploy");
    deployHfBtn.disabled = true;
    deployHfBtn.innerText = '⏳ Deploying...';
    appendToConsole("🤗 Deploying to Hugging Face Space...");
    try {
      const data = await safeFetch(API_DEPLOY_HF, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repo_full_name: repoName, files: generatedFiles, platform: currentPlatform })
      });
      if (data.error) throw new Error(data.error);
      saveDeployment({
        appName: appNameInput.value.trim(),
        timestamp: Date.now(),
        hfUrl: data.space_url
      });
      appendToConsole(`✅ Hugging Face Space: ${data.space_url}`);
    } catch(e) {
      appendToConsole(`❌ HF deploy failed: ${e.message}`);
    } finally {
      deployHfBtn.disabled = false;
      deployHfBtn.innerText = '🤗 Deploy to HF';
    }
  }

  function downloadZip() {
    if (!generatedFiles || Object.keys(generatedFiles).length === 0) return;
    const zip = new JSZip();
    for (const [name, content] of Object.entries(generatedFiles)) zip.file(name, content);
    zip.generateAsync({ type: 'blob' }).then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${repoName}.zip`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  }

  function updateAuthUI() {
    if (githubToken) {
      loginBtn.style.display = 'none';
      gitBadge.style.display = 'inline-flex';
      gitUser.innerText = githubUsername || 'user';
    } else {
      loginBtn.style.display = 'inline-block';
      gitBadge.style.display = 'none';
    }
  }

  function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') document.body.style.background = '#f5f5f5';
    themeToggle.onclick = () => {
      const isLight = document.body.style.background === '#f5f5f5';
      document.body.style.background = isLight ? '#0a0e1a' : '#f5f5f5';
      localStorage.setItem('theme', isLight ? 'dark' : 'light');
    };
  }

  function handleRedirectTokens() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const user = params.get('github_user');
    if (token) {
      localStorage.setItem('github_token', token);
      if (user) localStorage.setItem('github_user', user);
      window.history.replaceState({}, '', window.location.pathname);
      location.reload();
    }
  }

  generateBtn.onclick = generate;
  deployGithubBtn.onclick = deployToGitHub;
  deployHfBtn.onclick = deployToHF;
  downloadZipBtn.onclick = downloadZip;
  clearConsoleBtn.onclick = () => { consoleOut.innerText = ''; };
  loginBtn.onclick = () => window.location.href = AUTH_GITHUB;
  disconnectGit.onclick = () => {
    localStorage.removeItem('github_token');
    localStorage.removeItem('github_user');
    location.reload();
  };
  platformSelect.onchange = () => {
    const isGithub = platformSelect.value === 'github';
    if (isGithub) deployHfBtn.style.display = 'none';
    else deployHfBtn.style.display = 'inline-block';
  };

  handleRedirectTokens();
  updateAuthUI();
  initTheme();
  renderDeployments();
  appendToConsole("GrishteSync ready. Choose project type, enter app name and prompt.");
</script>
</body>
</html>
