<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrishteSync - AI Code Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app">
        <header>
            <h1>⚡ GrishteSync</h1>
            <p>Generate, edit, and deploy full-stack apps with AI</p>
        </header>

        <main>
            <!-- Input Panel -->
            <section class="input-panel">
                <div class="form-group">
                    <label for="project-type">Project Type</label>
                    <select id="project-type">
                        <option value="webapp">Web Application</option>
                        <option value="python">Python Script</option>
                        <option value="fullstack">Full-Stack App (Flask/FastAPI + DB)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Describe your project</label>
                    <textarea id="description" rows="4" placeholder="e.g., A todo list with user authentication..."></textarea>
                </div>
                <div class="actions">
                    <button id="generate-btn" class="btn btn-primary">🚀 Generate</button>
                    <button id="review-btn" class="btn btn-outline">🔍 Review</button>
                    <button id="deploy-github-btn" class="btn btn-outline">📦 Deploy to GitHub</button>
                    <button id="deploy-hf-btn" class="btn btn-outline">🤗 Deploy to HF</button>
                </div>
                <div id="status" class="status"></div>
            </section>

            <!-- Editor Panel -->
            <section class="editor-panel">
                <div class="file-tabs" id="file-tabs">
                    <!-- Tabs will be dynamically generated -->
                </div>
                <div id="editor-container">
                    <!-- Monaco editor will be mounted here -->
                </div>
                <!-- Floating balloon for code selection -->
                <div id="edit-balloon" style="display: none; position: absolute; background: #1e1e2f; border: 1px solid #4a4a6a; border-radius: 12px; padding: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); z-index: 1000; min-width: 280px; font-family: 'Inter', -apple-system, sans-serif;">
                    <textarea id="balloon-input" rows="2" placeholder="Describe the change..." style="width: 100%; background: #2a2a3e; color: #e0e0e0; border: 1px solid #3a3a5a; border-radius: 6px; padding: 8px; font-size: 14px; resize: vertical;"></textarea>
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <button id="balloon-submit" class="btn btn-primary" style="flex:1;">Apply</button>
                        <button id="balloon-cancel" class="btn btn-outline" style="flex:1;">Cancel</button>
                    </div>
                    <div id="balloon-loading" style="display:none; text-align:center; color:#aaa; margin-top:6px;">⏳ Sending...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs/loader.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
